<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glane</title>
<meta name="description" content="Everything worth keeping, in one place">
<link rel="manifest" href="/manifest.json?v=2">
<meta name="theme-color" content="#F2F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Glane">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<link rel="icon" type="image/png" href="/icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F1EE;--paper:#FFFFFF;--ink:#171615;--muted:#8A857E;--line:#DEDAD3;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html.locked,html.locked body{overflow:hidden}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
button{font:inherit;color:inherit}
.app{max-width:1280px;margin:0 auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) clamp(18px,5vw,56px) calc(130px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.label{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.item,.cap,.quote,.textcard,.nopv,.pvfig,.dmeta,.feedhead h1,.opt,.toast,.acct{overflow-wrap:anywhere;min-width:0}

/* Barre du haut */
.topline{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px}
.brand{font-family:var(--serif);font-size:34px;line-height:1;background:none;border:0;padding:0;cursor:pointer}
.me{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);background:transparent;font-family:var(--serif);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;text-transform:uppercase}
.sticky{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 calc(-1 * clamp(18px,5vw,56px));padding:10px clamp(18px,5vw,56px) 0;border-bottom:1px solid var(--line)}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 12px;color:var(--muted);min-width:0}
.search:focus-within{border-color:var(--ink)}
.search input{border:0;outline:0;font:inherit;font-size:16px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.iconbtn{flex:none;position:relative;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn.on{border-color:var(--ink)}
.iconbtn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.clear{border:0;background:none;padding:4px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.catbar{display:flex;align-items:stretch;margin-top:6px}
.cats{flex:1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px 11px;min-width:64px;color:var(--muted);border-bottom:2px solid transparent;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;transition:color .15s}
.cat:hover{color:var(--ink)}
.cat.on{color:var(--ink);border-color:var(--ink)}
.cat svg{display:block}
.newcat{flex:none;border:0;border-left:1px solid var(--line);background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px 11px 14px;margin-left:4px;color:var(--ink);font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.newcat .plus{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}

/* En-tête du contenu affiché */
.feedhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 0 20px}
.feedhead h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,8vw,64px);line-height:.95;margin:0;letter-spacing:-.02em}
.feedhead .meta{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.editcat{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.intro{padding:26px 0 8px;max-width:560px}
.intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,7vw,60px);line-height:1;margin:0 0 12px;letter-spacing:-.015em}
.intro p{color:var(--muted);font-size:15px;line-height:1.65;margin:0 0 22px}

/* Grille de contenus */
.grid{columns:2;column-gap:14px}
@media (min-width:700px){.grid{columns:230px;column-gap:26px}}
.item{break-inside:avoid;margin-bottom:30px;cursor:pointer;display:block}
.media{background:var(--tint);border-radius:4px;overflow:hidden;position:relative}
.media img.full{width:100%;display:block;transition:opacity .3s ease}
.item:hover .media img.full{opacity:.9}
.media img.broken{display:none}
.cap{padding:10px 0 0}
.cap .t{font-family:var(--serif);font-size:18.5px;line-height:1.15;margin-top:4px}
.cap .p{font-size:12.5px;margin-top:5px;letter-spacing:.02em}
.cap .n{font-size:13px;color:var(--muted);margin-top:4px}
.quote{padding:28px 20px 32px;font-family:var(--serif);font-size:23px;line-height:1.16}
.quote.dated,.textcard.dated{padding-top:72px}
.quote.plain{font-size:22px;line-height:1.2}
.textcard{padding:22px 18px 20px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.fav{width:22px;height:22px;border-radius:4px;filter:grayscale(1);opacity:.75}
.fav.broken{visibility:hidden}
.textcard .t{font-family:var(--serif);font-size:24px;line-height:1.04}
.datebadge{position:absolute;left:10px;top:10px;background:var(--paper);border-radius:3px;padding:6px 9px 5px;text-align:center;line-height:1;min-width:44px}
.datebadge b{display:block;font-family:var(--serif);font-weight:400;font-size:22px}
.datebadge span{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.item.past{opacity:.42}

/* Invitation aux notifications et carte de décision */
.nudge{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:22px}
.nudge-ic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.nudge-tx b{display:block;font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.15}
.nudge-tx span{display:block;color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:4px}
.nudge-row{display:flex;align-items:center;gap:16px;margin-top:12px}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.datechip{position:relative;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--ink)}
.datechip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.datechip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0;margin:0}
.remindbadge{position:absolute;left:10px;bottom:10px;background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 9px 4px 7px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.remindbadge.due{background:var(--ink);color:var(--bg)}
.upnext{margin-top:22px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:14px 16px 4px}
.uplist{margin-top:6px}
.uprow{width:100%;display:flex;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);background:none;padding:12px 0;cursor:pointer;text-align:left;color:var(--ink);font-size:14px;font:inherit}
.uprow:first-child{border-top:0}
.uprow.due .label{color:var(--ink)}
.uptitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.todoadd{display:flex;gap:8px;align-items:center;margin:0 0 14px}
.datebtn{width:auto;min-width:44px;padding:0 12px;display:flex;gap:6px;font-size:12.5px;font-weight:600}
.datebtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.todochips{margin:-4px 0 16px}
.subhead.today{color:var(--ink)}
.todometa.due{color:var(--ink);font-weight:700}
.check.round{border-radius:50%}
.caticon{position:relative;display:block}
.catbadge{position:absolute;top:-5px;right:-10px;min-width:17px;height:17px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;line-height:17px;text-align:center;padding:0 4px}
.todoadd .input{margin:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--paper)}
.todoadd .input:focus{border-color:var(--ink)}
.todoadd .btn{height:44px}
.todolist{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.todorow{display:flex;align-items:center;gap:12px;padding:0 14px;border-top:1px solid var(--line)}
.todorow:first-child{border-top:0}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--bg);padding:0}
.check.on{background:var(--ink);border-color:var(--ink)}
.todotext{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border:0;background:none;text-align:left;padding:15px 0;cursor:pointer;color:var(--ink);font:inherit}
div.todotext{cursor:default}
.todolabel{font-size:15.5px;line-height:1.35;overflow-wrap:anywhere}
.todometa{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.todorow.done .todolabel{text-decoration:line-through;color:var(--muted)}
.donehead{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.linkbtn.muted{color:var(--muted)}
.toast.withundo{display:flex;align-items:center;gap:14px;padding-right:8px}
.toast{width:max-content}
.toast button{flex:none;white-space:nowrap;border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:5px;padding:6px 11px;font:inherit;font-weight:700;cursor:pointer}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;cursor:pointer;padding:0;margin:22px 0 0}
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}
@media (min-width:600px){.ptiles{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:32px 20px}}
.ptile{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.pcover{background:var(--tint);aspect-ratio:4/5;border-radius:6px;overflow:hidden;display:grid;grid-template:1fr/1fr;transition:opacity .3s}
.ptile:hover .pcover{opacity:.88}
.pcover img{width:100%;height:100%;object-fit:cover;display:block}
.pcover img.broken{visibility:hidden}
.pcover.c4{grid-template:1fr 1fr/1fr 1fr;gap:2px}
.pcover.center{place-items:center;color:var(--ink)}
.pquote{font-family:var(--serif);font-size:19px;line-height:1.15;padding:18px;align-self:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.pname{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-size:23px;line-height:1.05;margin:10px 0 4px;overflow-wrap:anywhere}
.pname svg{flex:none}
.headbtns{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
a.brand{text-decoration:none;color:var(--ink)}
.pubhead h1{display:flex;align-items:center;gap:14px;margin-top:8px}
.pubicon{display:inline-grid;place-items:center;opacity:.8}
.pubfoot{text-align:center;color:var(--muted);font-size:13.5px;margin:40px 0 0}
.pubfoot a{color:var(--ink);font-weight:600}
.imgrow{justify-content:center;gap:22px;margin:0 0 18px}
.dmeta{margin-top:0}

/* Sections (événements) et état vide */
.subhead{margin:4px 0 18px}
.empty{border:1px solid var(--line);border-radius:6px;padding:48px 22px;text-align:center;color:var(--muted);line-height:1.6}
.empty b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;color:var(--ink);margin-bottom:6px}

/* Boutons */
.btn{height:46px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;letter-spacing:.01em;padding:0 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:#9E3B32;border-color:#9E3B32;color:#fff}
.btn.wide{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:30}

/* Panneaux */
.sheetbg{position:fixed;inset:0;background:rgba(23,22,21,.36);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:min(600px,100%);border-radius:16px 16px 0 0;padding:12px 22px calc(28px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;overscroll-behavior:contain;animation:up .24s ease-out;-webkit-overflow-scrolling:touch}
.sheet.still{animation:none}
@media (min-width:720px){.sheetbg{align-items:center;padding:24px}.sheet{border-radius:12px;padding:16px 32px 32px}}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.grab{width:36px;height:3px;border-radius:9px;background:var(--line);margin:0 auto 18px}
.pv{display:flex;justify-content:center;margin-bottom:22px}
.pv img.big{max-height:300px;max-width:100%;border-radius:4px;display:block;background:var(--bg)}
.pv .quote,.pv .textcard{border-radius:4px;width:100%;min-height:0}
.pv .quote{max-height:280px;overflow:auto}
.pvfig{margin:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pvfig .t{font-family:var(--serif);font-size:21px;line-height:1.15;margin-top:6px}
.pvfig .p{font-size:13px}
.nopv{width:100%;border-radius:4px;background:var(--bg);padding:24px;text-align:center}
.nopv .t{font-family:var(--serif);font-size:23px;line-height:1.1;margin:8px 0 8px}
.nopv p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5}
.loader{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(23,22,21,.12);border-top-color:var(--ink);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.ask{font-family:var(--serif);font-size:34px;line-height:1;margin:0 0 18px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:11px;text-align:left;font-size:14.5px;font-weight:600;line-height:1.2;color:var(--ink)}
.opt svg{flex:none;color:var(--ink)}
.opt:hover{border-color:var(--muted)}
.opt.sug{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink)}
.opt.add{color:var(--muted);border-style:dashed}
.opt.add svg{color:var(--muted)}
.more{margin-top:20px}
.input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;font:inherit;font-size:16px;outline:0;background:transparent;color:var(--ink);margin-top:6px;display:block}
.input:focus{border-color:var(--ink)}
textarea.input{resize:vertical;min-height:56px;line-height:1.5}
input[type=date].input{min-height:46px}
.lbl{margin:24px 0 10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{background:var(--tint);width:34px;height:34px;border-radius:4px;border:1px solid rgba(0,0,0,.06);cursor:pointer}
.swatches button.on{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.seg{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.seg button{border:0;background:none;padding:0 0 10px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);margin-bottom:-1px;border-bottom:1px solid transparent}
.seg button.on{color:var(--ink);border-color:var(--ink)}
.edprev{background:var(--tint);border-radius:10px;padding:20px;font-family:var(--serif);font-size:32px;line-height:1;margin-bottom:6px;display:flex;align-items:center;gap:14px}
.edprev svg{flex:none}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icons button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icons button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.choice button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.moveto{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.moveto button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 13px 8px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--ink)}
.moveto button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dmeta{text-align:center;margin:-8px 0 8px;font-size:13px}
.keybox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:.02em}
.acct{font-family:var(--serif);font-size:26px;margin:4px 0 0}
.note{color:var(--muted);font-size:14px;line-height:1.55;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:6px;padding:11px 16px;z-index:60;font-size:14px;max-width:calc(100vw - 40px);text-align:center}

/* Connexion */
.authbox{max-width:380px;margin:12vh auto 0}
.authbox .brand{font-size:84px;display:block;margin-bottom:10px;cursor:default}
.authbox .tag{font-family:var(--serif);font-size:22px;line-height:1.25;color:var(--muted);margin:0 0 38px}
.authbox .seg{margin-bottom:10px}
.authbox .btn{margin-top:26px;width:100%}
.err{color:#9E3B32;font-size:14px;min-height:20px;margin-top:14px;line-height:1.4}
.tinted{background:var(--tint)}

/* Mode sombre : suit le réglage du téléphone */
@media (prefers-color-scheme:dark){
  :root{--bg:#131312;--paper:#1C1B1A;--ink:#EAE7E1;--muted:#8E8982;--line:#2F2D2B;color-scheme:dark}
  .media,.tinted,.edprev,.pcover{background:color-mix(in srgb,var(--tint) 16%,#1C1B1A)}
  .swatch,.swatches button{background:color-mix(in srgb,var(--tint) 75%,#1C1B1A)}
  .datebadge{background:#131312}
  .sheetbg{background:rgba(0,0,0,.62)}
  .fav{opacity:.6}

const boardById = (id) => S.boards.find((b) => b.id === id) || NONE;
const boardOf = (i) => boardById(i.board_id || null);
const isEventsBoard = (b) => !!b && b.kind === "events";
const isTodoBoard = (b) => !!b && b.kind === "todo";
const isTask = (i) => isTodoBoard(boardOf(i));
const mainTodo = () => S.boards.find((b) => isTodoBoard(b) && b.slug === "todo") || S.boards.find(isTodoBoard) || null;
// Ce que montre une liste : ses tâches, et pour la To-do principale, tout élément d'un autre tableau qui a un rappel
function todoItems(b) {
  const own = itemsOf(b.id);
  if (!mainTodo() || mainTodo().id !== b.id) return own;
  return own.concat(S.items.filter((i) => i.remind_on && !isTask(i)));
}
const dueTodayCount = () => { const m = mainTodo(); return m ? todoItems(m).filter((i) => !i.done_at && reminderDue(i)).length : 0; };
const itemsOf = (id) => S.items.filter((i) => (i.board_id || null) === id);
const cleanTitle = (t) => (t && !BLOCKED.test(t) ? t : "");
const titleOf = (i) => cleanTitle(i.title) || (i.type === "link" ? hostOf(i.url) || T.link : "");
const img = (src, cls = "") => `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('broken')">`;
const pad = (n) => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dateParts = (iso) => {
  const d = new Date(iso + "T00:00:00");
  return { day: d.getDate(), month: d.toLocaleDateString("en-GB", { month: "short" }), long: d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "long", year: "numeric" }) };
};
// Seules les vraies citations ont des guillemets ; les autres notes sont affichées telles quelles
const isQuoteItem = (i) => { const b = boardOf(i); return b.slug === "quotes" || b.emoji === "quote" || !b.id; };
const noteText = (i, max) => { const t = max ? clip(i.text, max) : i.text; return isQuoteItem(i) ? `“${t}”` : t; };
const isoLocal = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const inDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return isoLocal(d); };
const nextDow = (dow) => { const d = new Date(); let add = (dow - d.getDay() + 7) % 7; if (add === 0) add = 7; d.setDate(d.getDate() + add); return isoLocal(d); };
const nextWeekend = () => nextDow(6); // samedi
const nextWeekStart = () => nextDow(1); // lundi
function shortDate(iso) {
  if (iso <= today()) return T.todayWord;
  if (iso === inDays(1)) return T.tomorrow;
  return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}
const inSentence = (iso) => { const d = shortDate(iso); return d === T.tomorrow || d === T.todayWord ? d.toLowerCase() : `on ${d}`; };
const shortLabel = (i) => titleOf(i) || clip(i.text || "", 60) || T.link;
const reminderDue = (i) => !!i.remind_on && i.remind_on <= today();

function reminderControls(current) {
  const presets = [[inDays(1), T.tomorrow], [nextWeekend(), T.thisWeekend], [nextWeekStart(), T.nextWeek]];
  const custom = current && !presets.some(([v]) => v === current);
  return `<div class="choice">
    ${presets.map(([v, l]) => `<button class="${current === v ? "on" : ""}" data-a="set-remind" data-v="${v}">${esc(l)}</button>`).join("")}
    <label class="datechip ${custom ? "on" : ""}">${icon("calendar", 14, 1.8)}<span>${esc(custom ? shortDate(current) : T.pickDate)}</span><input type="date" data-field="remind_on" min="${inDays(1)}" value="${esc(current || "")}" aria-label="${esc(T.pickDate)}"></label>
    ${current ? `<button data-a="set-remind" data-v="">${esc(T.noReminder)}</button>` : ""}
  </div>`;
}

const isPast = (i) => !!i.event_date && i.event_date < today();

function readShare() {
  if (SHARE || PROFILE) return null; // les pages partagées gardent leur adresse
  const p = new URLSearchParams(location.search);
  const url = p.get("url"), text = p.get("text"), title = p.get("title");
  if (!url && !text && !title) {
    if (location.search) history.replaceState(null, "", "/");
    return null;
  }
  history.replaceState(null, "", "/");
  return parseInput([url, text, title].filter(Boolean).join(" "), text || title);
}

function parseInput(raw, fallbackText) {
  const t = String(raw || "").trim();
  if (!t) return null;
  const m = t.match(/https?:\/\/[^\s<>"]+/);
  if (m && t.replace(m[0], "").trim().length < 120) return { kind: "link", url: m[0].replace(/[)\].,;!?»"']+$/, "") };
  return { kind: "text", text: (fallbackText || t).trim() };
}

// ---------- Session et appels serveur ----------
function setSession(s) {
  S.session = s;
  ls.set("glane-session", s ? JSON.stringify(s) : "");
}

async function authCall(body) {
  const needsSession = !["login", "signup", "refresh"].includes(body.action);
  if (needsSession && S.session && S.session.expires_at - Date.now() / 1000 < 90) {
    try { await refreshSession(); } catch { sessionEnded(); }
  }
  const r = await fetch("/api?route=auth", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(S.session ? { Authorization: `Bearer ${S.session.access_token}` } : {}) },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(data.error || `Error ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return data;
}

function refreshSession() {
  if (!refreshing) {
    refreshing = (async () => {
      const r = await fetch("/api?route=auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "refresh", refresh_token: S.session && S.session.refresh_token }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.session) throw Object.assign(new Error("Session expired"), { status: 401 });
      setSession({ ...d.session, email: d.session.email || (S.session && S.session.email) });
    })().finally(() => { refreshing = null; });
  }
  return refreshing;
}

function sessionEnded() {
  if (S.session) {
    setSession(null);
    S.boards = [];
    S.items = [];
    S.archived = [];
    S.sheet = null;
    S.authMode = "login";
    S.authForm.email = S.authForm.email || "";
    renderAuth(T.sessionEnded);
  }
  throw Object.assign(new Error("Signed out"), { status: 401 });
}

async function api(path, opts = {}, retried = false) {
  if (!S.session) sessionEnded();
  if (S.session.expires_at - Date.now() / 1000 < 90) {
    try { await refreshSession(); } catch { sessionEnded(); }
  }
  const r = await fetch(path.startsWith("/") ? path : "/api/" + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${S.session.access_token}` },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401) {
    if (retried) sessionEnded();
    try { await refreshSession(); } catch { sessionEnded(); }
    return api(path, opts, true);
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(data.error || `Error ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return data;
}

let toastUndo = null;
function toast(msg, undo) {
  const el = document.getElementById("toast");
  if (!el) return;
  toastUndo = undo || null;
  el.innerHTML = `<div class="toast ${undo ? "withundo" : ""}" role="status">${esc(msg)}${undo ? `<button data-a="toast-undo">${esc(T.undo)}</button>` : ""}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ""; toastUndo = null; }, undo ? 5500 : 3500);
}

function handleErr(e, prefix = T.failed) {
  if (e.status === 401) return; // déjà renvoyée vers l'écran de connexion
  toast(prefix + e.message);
}

function compress(file, max = 1400, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const im = new Image();
      im.onerror = reject;
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * s);
        c.height = Math.round(im.height * s);
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(im, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function pickFile(target) {
  S.fileTarget = target;
  $file.click();
}

function replaceItem(item) {
  S.items = S.items.map((x) => (x.id === item.id ? item : x));
}

function moveToArchive(ids) {
  const at = new Date().toISOString();
  const moving = S.items.filter((x) => ids.includes(x.id)).map((x) => ({ ...x, archived_at: x.archived_at || at }));
  S.items = S.items.filter((x) => !ids.includes(x.id));
  S.archived = moving.concat(S.archived.filter((x) => !ids.includes(x.id)));
}

function moveBackFromArchive(item) {
  S.archived = S.archived.filter((x) => x.id !== item.id);
  S.items = S.items.filter((x) => x.id !== item.id).concat([{ ...item, archived_at: null }])
    .sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
}

async function archiveItem(id) {
  moveToArchive([id]);
  S.sheet = null;
  renderSheet();
  renderMain();
  toast(T.archived, () => restoreItem(id, true));
  try {
    await api("items?id=" + id, { method: "PATCH", body: { archived: true } });
  } catch (e) {
    handleErr(e);
  }
}

function leaveEmptyArchive() {
  if (S.cat === "__archive" && !S.archived.length) S.cat = "all";
}

async function restoreItem(id, quiet) {
  const it = S.archived.find((x) => x.id === id);
  if (!it) return;
  moveBackFromArchive(it);
  leaveEmptyArchive();
  if (S.sheet && S.sheet.id === id) S.sheet = null;
  renderSheet();
  renderMain();
  if (!quiet) toast(T.restored(boardOf(it).name));
  try {
    const { item } = await api("items?id=" + id, { method: "PATCH", body: { archived: false } });
    replaceItem(item);
  } catch (e) {
    handleErr(e);
  }
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(T.copied);
  } catch {
    window.prompt(T.copyKey, text);
  }
}

// ---------- Notifications ----------
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

async function pushState() {
  if (!pushSupported()) return isIOS() && !isStandalone() ? "install" : "unsupported";
  if (Notification.permission === "denied") return "denied";
  try {
    const reg = await navigator.serviceWorker.ready;
    return (await reg.pushManager.getSubscription()) ? "on" : "off";
  } catch {
    return "unsupported";
  }
}

function b64ToBytes(b64) {
  const s = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64.length + 3) % 4));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}

async function enablePush() {
  // La demande d'autorisation doit partir directement du toucher de l'utilisateur
  const permission = await Notification.requestPermission();
  if (permission !== "granted") return permission === "denied" ? "denied" : "off";
  const { publicKey } = await api("/api?route=push");
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
  await api("/api?route=push", { method: "POST", body: { action: "subscribe", subscription: sub.toJSON() } });
  return "on";
}

async function disablePush() {
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub) {
    await api("/api?route=push", { method: "POST", body: { action: "unsubscribe", endpoint: sub.endpoint } }).catch(() => {});
    await sub.unsubscribe().catch(() => {});
  }
  return "off";
}

function feedback(n, item, value) {
  if (!n && !item) return Promise.resolve();
  return api("/api?route=push", { method: "POST", body: { action: "feedback", n: n || null, item: item || null, value } }).catch(() => {});
}

// ---------- Presse-papiers ----------
// Renvoie { kind: "image", blob } ou { kind: "text", text }, null si vide ; lève une erreur si refusé
async function readClipboard() {
  if (navigator.clipboard && navigator.clipboard.read) {
    const entries = await navigator.clipboard.read();
    for (const entry of entries) {
      const imgType = entry.types.find((t) => t.startsWith("image/"));
      if (imgType) return { kind: "image", blob: await entry.getType(imgType) };
    }
    for (const entry of entries) {
      if (entry.types.includes("text/plain")) {
        const text = await (await entry.getType("text/plain")).text();
        if (text.trim()) return { kind: "text", text };
      }
    }
    return null;
  }
  const text = await navigator.clipboard.readText();
  return text && text.trim() ? { kind: "text", text } : null;
}

async function toShot(blob) {
  const dataUrl = await compress(blob);
  return { dataUrl, b64: dataUrl.split(",")[1] };
}

  }
  s.busy = "";
  if (S.sheet === s) renderSheet();
  renderMain();
}

// Le serveur dit si un code d'invitation est nécessaire ; l'écran s'adapte
async function loadAuthConfig() {
  try {
    const r = await fetch("/api?route=auth&config=1");
    const d = await r.json();
    const needed = d.inviteRequired !== false;
    if (needed !== S.inviteRequired) {
      S.inviteRequired = needed;
      const err = document.getElementById("a-err");
      if (document.querySelector(".authbox")) renderAuth(err ? err.textContent : "");
    }
  } catch {
    // en cas de doute, le champ reste affiché
  }
}

async function submitAuth() {
  const f = S.authForm;
  const btn = document.getElementById("a-go");
  const errEl = document.getElementById("a-err");
  btn.disabled = true;
  btn.textContent = T.signingIn;
  errEl.textContent = "";
  try {
    const action = S.authMode === "signup" ? "signup" : "login";
    const { session } = await authCall({ action, email: f.email, password: f.password, invite: S.inviteRequired ? f.invite : "" });
    setSession(session);
    S.authForm = { email: "", password: "", invite: "" };
    S.authMode = "login"; // la prochaine fois, on revient sur « Sign in »
    start();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = S.authMode === "signup" ? T.signUp : T.signIn;
    errEl.textContent = e.status ? e.message : T.unreachable + e.message;
  }
}

async function start() {
  if (SHARE) return startPublic();
  if (PROFILE) return startProfile();
  if (!S.session) {
    renderAuth("");
    loadAuthConfig();

  }
  S.cat = "all";
  S.type = "all";
  S.sort = "new";
  S.q = "";
  shell();
  S.loading = true;
  renderMain();

    const d = S.deep;

    openRevisit(d);
  } else if (ok && S.pending) {
    const p = S.pending;

async function load() {
  try {
    const [b, i, a] = await Promise.all([api("boards"), api("items"), api("items?archived=1").catch(() => ({ items: [] }))]);
    S.boards = b.boards || [];
    S.items = i.items || [];
    S.archived = a.items || [];
    return true;
  } catch (e) {
    handleErr(e, T.loadFail);
    return false;
  } finally {
    S.loading = false;
    renderMain();
  }
}

async function startPublic() {
  const main = publicShell();
  try {
    const r = await fetch("/api?route=public&t=" + encodeURIComponent(SHARE));
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.board) throw new Error(d.error || "gone");
    S.boards = [d.board];
    S.items = d.items || [];
    document.title = `${d.board.name} · Glane`;
    main.innerHTML = publicHtml(d.board, S.items);
  } catch {
    main.innerHTML = `<div class="empty" style="margin-top:26px"><b>${esc(T.shareGoneTitle)}</b>${esc(T.shareGoneText)}</div>`;
  }
}

function publicHtml(b, items) {
  let body;
  if (!items.length) {
    body = `<div class="empty"><b>${esc(T.emptyCat)}</b></div>`;
  } else if (isTodoBoard(b)) {
    body = todoHtml(items, true);
  } else if (isEventsBoard(b)) {
    const up = items.filter((i) => i.event_date && !isPast(i)).sort((x, y) => x.event_date.localeCompare(y.event_date));
    const undated = items.filter((i) => !i.event_date);
    const past = items.filter(isPast).sort((x, y) => y.event_date.localeCompare(x.event_date));
    const section = (label, l) => (l.length ? `<div class="subhead label">${esc(label)}</div>${grid(l, false)}` : "");
    body = section(T.upcoming, up) + section(T.undated, undated) + section(T.past, past);
  } else {
    body = grid(items, false);
  }
  return `
    <div class="feedhead pubhead">
      <div>
        <div class="label">${esc(T.sharedBoard)}</div>
        <h1><span class="pubicon">${icon(iconOf(b), 34, 1.2)}</span>${esc(b.name)}</h1>
        <div class="meta"><span class="label">${esc(T.items(items.length))}</span></div>
      </div>
    </div>
    ${body}
    <p class="pubfoot">${esc(T.keptWith)} <a href="/">${esc(T.startOwn)}</a></p>`;
}

async function startProfile() {
  const main = publicShell();
  try {
    const r = await fetch("/api?route=public&p=" + encodeURIComponent(PROFILE));
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.profile) throw new Error("gone");
    S.profile = d.profile;
    S.boards = d.profile.boards;
  } catch {
    main.innerHTML = `<div class="empty" style="margin-top:26px"><b>${esc(T.profileGoneTitle)}</b>${esc(T.profileGoneText)}</div>`;
    return;
  }
  window.addEventListener("popstate", () => {
    const b = new URLSearchParams(location.search).get("b");
    if (b) showProfileBoard(b, false);
    else renderProfile();
  });
  const b = new URLSearchParams(location.search).get("b");
  if (b && S.profile.boards.some((x) => x.id === b)) showProfileBoard(b, false);
  else renderProfile();
}

function profileUrl(boardId) {
  const pretty = location.pathname.startsWith("/p/");
  const q = new URLSearchParams();
  if (!pretty) q.set("p", PROFILE);
  if (boardId) q.set("b", boardId);
  const qs = q.toString();
  return (pretty ? location.pathname : "/") + (qs ? "?" + qs : "");
}

function profileTile(b) {
  const tint = `style="--tint:${esc(b.color)}"`;
  let cover;
  if (b.covers.length >= 4) cover = `<div class="pcover c4" ${tint}>${b.covers.map((c) => img(c)).join("")}</div>`;
  else if (b.covers.length) cover = `<div class="pcover" ${tint}>${img(b.covers[0])}</div>`;
  else if (b.quote) cover = `<div class="pcover" ${tint}><div class="pquote">${esc(clip(b.quote, 120))}</div></div>`;
  else cover = `<div class="pcover center" ${tint}>${icon(iconOf(b), 34, 1.2)}</div>`;
  return `<button class="ptile" data-a="profile-board" data-id="${b.id}">${cover}
    <div class="pname">${icon(iconOf(b), 15, 1.6)}<span>${esc(b.name)}</span></div>
    <div class="label">${esc(T.items(b.count))}</div></button>`;
}

function renderProfile() {
  const main = document.getElementById("main");
  const p = S.profile;
  document.title = `${p.name} · Glane`;
  main.innerHTML = `
    <div class="feedhead pubhead">
      <div>
        <div class="label">${esc(T.sharedProfile)}</div>
        <h1>${esc(p.name)}</h1>
        <div class="meta"><span class="label">${esc(T.boardsCount(p.boards.length))}</span></div>
      </div>
    </div>
    ${p.boards.length ? `<div class="ptiles">${p.boards.map(profileTile).join("")}</div>` : `<div class="empty"><b>${esc(T.profileEmpty)}</b></div>`}
    <p class="pubfoot">${esc(T.keptWith)} <a href="/">${esc(T.startOwn)}</a></p>`;
}

async function showProfileBoard(id, push = true) {
  const main = document.getElementById("main");
  main.innerHTML = `<p class="label" style="padding-top:26px">${esc(T.loading)}</p>`;
  if (push) history.pushState(null, "", profileUrl(id));
  window.scrollTo(0, 0);
  try {
    const r = await fetch(`/api?route=public&p=${encodeURIComponent(PROFILE)}&b=${encodeURIComponent(id)}`);
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.board) throw new Error("gone");
    S.items = d.items || [];
    document.title = `${d.board.name} · ${S.profile.name} · Glane`;
    main.innerHTML = `<button class="back label" data-a="profile-home">${ICON.back}${esc(S.profile.name)}</button>` + publicHtml(d.board, S.items).replace(esc(T.sharedBoard), esc(S.profile.name));
  } catch {
    main.innerHTML = `<button class="back label" data-a="profile-home">${ICON.back}${esc(S.profile.name)}</button><div class="empty"><b>${esc(T.shareGoneTitle)}</b></div>`;
  }
}

function openItem(id) {
  if (S.publicMode) return openSheet({ kind: "pubitem", id });
  if (S.cat === "__archive") return openSheet({ kind: "archived", id, armed: false });
  const it = S.items.find((x) => x.id === id);
  if (it && reminderDue(it)) return openSheet({ kind: "revisit", id, n: null });
  openDetail(id);
}

function pubitemSheet(s) {
  const i = S.items.find((x) => x.id === s.id);
  if (!i) return `<p class="note">${esc(T.gone)}</p>`;
  const b = boardOf(i);
  const t = i.type === "text" ? cleanTitle(i.title) : titleOf(i);
  const media = i.image_url
    ? img(i.image_url, "big")
    : i.type === "text"
      ? `<div class="quote tinted ${isQuoteItem(i) ? "" : "plain"}" style="--tint:${esc(b.color)}">${esc(noteText(i))}</div>`
      : `<div class="tinted" style="width:100%;border-radius:4px;overflow:hidden;--tint:${esc(b.color)}">${textCard(i)}</div>`;
  const meta = [i.site || hostOf(i.url), i.event_date ? dateParts(i.event_date).long : ""].filter(Boolean).join(" · ");
  return `
    <div class="pv">${media}</div>
    ${meta ? `<p class="dmeta label">${esc(meta)}</p>` : ""}
    ${t ? `<p class="acct" style="text-align:center;margin:0 0 8px">${esc(t)}</p>` : ""}
    ${i.image_url && i.type === "text" ? `<p class="note" style="text-align:center">${esc(noteText(i))}</p>` : ""}
    <div class="row" style="justify-content:center">
      ${i.url ? `<button class="btn" data-a="pub-open" data-id="${i.id}">${esc(T.open)}</button>` : ""}
      <button class="btn ghost" data-a="close">${esc(T.close)}</button>
    </div>`;
}

// ---------- Partager un tableau ----------
const shareUrl = (b) => `${location.origin}/s/${b.share_token}`;

function shareSheet(s) {
  const b = S.boards.find((x) => x.id === s.id);
  if (!b) return `<p class="note">${esc(T.gone)}</p>`;
  if (!b.share_token) {
    return `
      <p class="ask">${esc(T.shareTitle(b.name))}</p>
      <p class="note" style="margin-top:0">${esc(T.shareExplain)}</p>
      <div class="row">
        <button class="btn" data-a="share-create" ${s.busy ? "disabled" : ""}>${icon("link", 16, 1.8)}${esc(T.createLink)}</button>
        <button class="btn ghost" data-a="close">${esc(T.cancel)}</button>
      </div>`;
  }
  const url = shareUrl(b);
  const canShare = typeof navigator.share === "function";
  return `
    <p class="ask">${esc(T.shareTitle(b.name))}</p>
    <p class="note" style="margin-top:0">${esc(T.shareOn)}</p>
    <input class="input keybox" readonly value="${esc(url)}">
    <div class="row">
      ${canShare ? `<button class="btn" data-a="share-native">${esc(T.shareVia)}</button>` : ""}
      <button class="btn ${canShare ? "ghost" : ""}" data-a="share-copy">${esc(T.copyLink2)}</button>
      <button class="btn ghost" data-a="share-preview">${esc(T.preview)}</button>
    </div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:20px;margin-top:26px">
      <button class="btn ${s.armed ? "danger" : "ghost"} sm" data-a="share-stop" ${s.busy ? "disabled" : ""}>${esc(s.armed ? T.stopConfirm : T.stopSharing)}</button>
    </div>
    <p class="note">${esc(T.stopNote)}</p>`;
}

async function setSharing(s, on) {
  s.busy = true;
  renderSheet();
  try {
    const { board } = await api("boards?id=" + s.id, { method: "PATCH", body: { share: on } });
    S.boards = S.boards.map((x) => (x.id === board.id ? board : x));
    toast(on ? T.linkCreated : T.linkStopped);
  } catch (e) {
    handleErr(e);
  }
  s.busy = false;
  s.armed = false;
  if (S.sheet === s) renderSheet();
  renderFeed();
}

// ---------- Vues principales ----------
const currentBoard = () => (S.cat === "all" ? null : S.cat === "__none" ? NONE : S.cat === "__archive" ? ARCHIVE : S.boards.find((b) => b.id === S.cat) || null);
const filtersActive = () => S.type !== "all" || S.sort !== "new";

function renderMain() {
  if (S.cat !== "all" && !currentBoard()) S.cat = "all";
  renderCats();
  renderFeed();
}

function renderCats() {
  const el = document.getElementById("cats");
  if (!el) return;
  // La To-do principale vient juste après All : c'est là que vivent les rappels
  const hub = mainTodo();
  const ordered = hub ? [hub].concat(S.boards.filter((x) => x.id !== hub.id)) : S.boards;
  const tabs = [{ id: "all", name: T.all, ic: "all" }]
    .concat(ordered.map((b) => ({ id: b.id, name: b.name, ic: iconOf(b) })));
  if (itemsOf(null).length) tabs.push({ id: "__none", name: NONE.name, ic: "inbox" });
  if (S.archived.length || S.cat === "__archive") tabs.push({ id: "__archive", name: T.archive, ic: "archive" });
  const m = mainTodo();
  const dueN = dueTodayCount();
  el.innerHTML = tabs.map((t) => {
    const badge = m && t.id === m.id && dueN ? `<span class="catbadge">${dueN}</span>` : "";
    return `<button class="cat ${S.cat === t.id ? "on" : ""}" data-a="cat" data-id="${t.id}" ${S.cat === t.id ? 'aria-current="true"' : ""}><span class="caticon">${icon(t.ic, 22, 1.4)}${badge}</span>${esc(t.name)}</button>`;
  }).join("");
  const active = el.querySelector(".cat.on");
  if (active) {
    const l = active.offsetLeft, r = l + active.offsetWidth;
    if (l < el.scrollLeft || r > el.scrollLeft + el.clientWidth - 24) el.scrollTo({ left: Math.max(0, l - 16), behavior: "smooth" });
  }
  const b = currentBoard();
  const q = document.getElementById("q");
  if (q) q.placeholder = S.cat === "__archive" ? T.searchArchive : b ? T.searchIn(b.name) : T.searchPh;
  const fb = document.getElementById("filterbtn");
  if (fb) {
    fb.classList.toggle("on", filtersActive());
    fb.innerHTML = ICON.sliders + (filtersActive() ? '<span class="dot"></span>' : "");
  }
}

function visibleItems() {
  const b = currentBoard();
  let list = S.cat === "__archive" ? S.archived.slice() : b ? itemsOf(b.id) : S.items.filter((i) => S.q || !isTask(i));
  if (S.type !== "all") list = list.filter((i) => (S.type === "image" ? !!i.image_url && i.type !== "text" : i.type === S.type));
  const q = norm(S.q);
  if (q) {
    const words = q.split(/\s+/);
    list = list.filter((i) => {
      const hay = norm([titleOf(i), i.url, i.text, i.note, i.site, boardOf(i).name].join(" "));
      return words.every((w) => hay.includes(w));
    });
  }
  if (S.sort === "old") list.reverse();
  return list;
}

function renderFeed() {
  const main = document.getElementById("main");
  if (!main) return;
  if (S.loading && !S.items.length) {
    main.innerHTML = `<p class="label" style="padding-top:26px">${esc(T.loading)}</p>`;
    return;
  }
  if (!S.items.length && S.cat === "all" && !S.q) {
    main.innerHTML = `<section class="intro">
      <h1>${esc(T.introTitle)}</h1>
      <p>${esc(T.introText)}</p>
      <button class="btn" data-a="add">${ICON.plusS}${esc(T.add)}</button>
    </section>`;
    return;
  }
  const b = currentBoard();
  const list = visibleItems();
  const narrowed = !!S.q || filtersActive();
  if (S.cat === "__archive") {
    const head = `
      <div class="feedhead">
        <div>
          <h1>${esc(T.archive)}</h1>
          <div class="meta">
            <span class="label">${esc(S.q ? T.results(list.length) : T.items(list.length))}</span>
            ${filtersActive() ? `<button class="pill" data-a="reset-filters">${ICON.x}${esc(T.clearFilters)}</button>` : ""}
          </div>
          <p class="note" style="margin-top:10px">${esc(T.archivedNote)}</p>
        </div>
      </div>`;
    const body = list.length ? grid(list, true) : `<div class="empty"><b>${esc(narrowed ? T.noMatch : T.archiveEmpty)}</b></div>`;
    main.innerHTML = head + body;
    return;
  }
  const title = b ? b.name : T.everything;
  const countText = S.q ? T.results(list.length) : T.items(list.length);
  const head = `
    <div class="feedhead">
      <div>
        <h1>${esc(title)}</h1>
        <div class="meta">
          <span class="label">${esc(countText)}</span>
          ${b && b.on_profile ? `<button class="pill" data-a="edit-board" data-id="${b.id}">${icon("globe", 12, 1.8)}${esc(T.onProfile)}</button>` : ""}
          ${filtersActive() ? `<button class="pill" data-a="reset-filters">${ICON.x}${esc(T.clearFilters)}</button>` : ""}
          ${S.q && b ? `<button class="pill" data-a="search-everywhere">${esc(T.searchEverywhere)}</button>` : ""}
        </div>
      </div>
      ${b && b.id ? `<div class="headbtns">
        <button class="editcat" data-a="share-board" data-id="${b.id}">${icon("link", 13, 1.8)}${esc(b.share_token ? T.shared : T.share)}</button>
        <button class="editcat" data-a="edit-board" data-id="${b.id}">${ICON.pencil}${esc(T.editCat)}</button>
      </div>` : ""}
    </div>`;

  let body;
  if (b && isTodoBoard(b) && !S.q) {
    let all = todoItems(b);
    if (S.type !== "all") all = all.filter((i) => (S.type === "image" ? !!i.image_url && i.type !== "text" : i.type === S.type));
    main.innerHTML = nudgeHtml() + head.replace(esc(countText), esc(T.tasksLeft(all.filter((i) => !i.done_at).length))) + todoHtml(all, false);
    return;
  }
  if (!list.length) {
    body = narrowed
      ? `<div class="empty"><b>${esc(T.noMatch)}</b>${esc(T.noMatchHint)}</div>`
      : `<div class="empty"><b>${esc(T.emptyCat)}</b>${esc(T.emptyCatHint)}</div>`;
  } else if (b && isEventsBoard(b) && !narrowed) {
    const up = list.filter((i) => i.event_date && !isPast(i)).sort((x, y) => x.event_date.localeCompare(y.event_date));
    const undated = list.filter((i) => !i.event_date);
    const past = list.filter(isPast).sort((x, y) => y.event_date.localeCompare(x.event_date));
    const section = (label, l) => (l.length ? `<div class="subhead label">${esc(label)}</div>${grid(l, false)}` : "");
    body = section(T.upcoming, up) + section(T.undated, undated) + section(T.past, past);
  } else {
    body = grid(list, !b);
  }
  main.innerHTML = nudgeHtml() + head + body;
}

function upNextHtml() {
  if (S.cat !== "all" || S.q || filtersActive()) return "";
  const limit = inDays(7);
  const list = S.items.filter((i) => i.remind_on && i.remind_on <= limit).sort((a, b) => a.remind_on.localeCompare(b.remind_on)).slice(0, 6);
  if (!list.length) return "";
  return `<div class="upnext">
    <div class="label">${esc(T.comingUp)}</div>
    <div class="uplist">${list.map((i) => `<button class="uprow ${reminderDue(i) ? "due" : ""}" data-a="item" data-id="${i.id}">${icon("bell", 16, 1.7)}<span class="uptitle">${esc(shortLabel(i))}</span><span class="label">${esc(shortDate(i.remind_on))}</span></button>`).join("")}</div>
  </div>`;
}

function todoRow(i, readOnly) {
  const done = !!i.done_at;
  const task = isTask(i);
  const label = shortLabel(i);
  const from = task ? "" : boardOf(i).name;
  const when = i.remind_on && !done ? shortDate(i.remind_on) : "";
  const extra = [from, i.type === "link" ? i.site || hostOf(i.url) : "", when].filter(Boolean).join(" · ");
  const ic = task ? (when ? icon("bell", 11, 2) : "") : icon(iconOf(boardOf(i)), 12, 1.8);
  const box = readOnly
    ? `<span class="check ${done ? "on" : ""}">${done ? icon("tick", 14, 2.4) : ""}</span>`
    : `<button class="check ${done ? "on" : ""} ${task ? "" : "round"}" data-a="todo-check" data-id="${i.id}" aria-label="${esc(done ? T.markUndone : T.markDone)}">${done ? icon("tick", 14, 2.4) : ""}</button>`;
  const due = !done && reminderDue(i);
  const text = `<span class="todolabel">${esc(label)}</span>${extra ? `<span class="todometa ${due ? "due" : ""}">${ic}${esc(extra)}</span>` : ""}`;
  return `<div class="todorow ${done ? "done" : ""}">${box}${readOnly ? `<div class="todotext">${text}</div>` : `<button class="todotext" data-a="item" data-id="${i.id}">${text}</button>`}</div>`;
}

function todoAddHtml() {
  const d = S.todoDate || "";
  const presets = [[inDays(1), T.tomorrow], [nextWeekend(), T.thisWeekend], [nextWeekStart(), T.nextWeek]];
  const custom = d && !presets.some(([v]) => v === d);
  return `<div class="todoadd">
      <input id="todoinput" class="input" placeholder="${esc(T.addTask)}" enterkeyhint="done" autocomplete="off" value="${esc(S.todoDraft || "")}">
      <button class="iconbtn datebtn ${d ? "on" : ""}" data-a="todo-date" aria-label="${esc(T.setDate)}">${icon("bell", 17, 1.7)}${d ? `<span>${esc(shortDate(d))}</span>` : ""}</button>
      <button class="btn sm" data-a="todo-add">${esc(T.add2)}</button>
    </div>
    ${S.todoDatePicker ? `<div class="choice todochips">
      ${presets.map(([v, l]) => `<button class="${d === v ? "on" : ""}" data-a="todo-date-set" data-v="${v}">${esc(l)}</button>`).join("")}
      <label class="datechip ${custom ? "on" : ""}">${icon("calendar", 14, 1.8)}<span>${esc(custom ? shortDate(d) : T.pickDate)}</span><input type="date" id="tododate" min="${inDays(1)}" value="${esc(d)}" aria-label="${esc(T.pickDate)}"></label>
      ${d ? `<button data-a="todo-date-set" data-v="">${esc(T.noDate2)}</button>` : ""}
    </div>` : ""}`;
}

function todoHtml(list, readOnly) {
  const open = list.filter((i) => !i.done_at);
  const done = list.filter((i) => i.done_at).sort((a, b) => (b.done_at || "").localeCompare(a.done_at || ""));
  const byDate = (a, b) => a.remind_on.localeCompare(b.remind_on) || (a.created_at || "").localeCompare(b.created_at || "");
  const byCreated = (a, b) => (a.created_at || "").localeCompare(b.created_at || "");
  const today = open.filter((i) => reminderDue(i)).sort(byDate);
  const upcoming = open.filter((i) => i.remind_on && !reminderDue(i)).sort(byDate);
  const anytime = open.filter((i) => !i.remind_on).sort(byCreated);
  const block = (rows) => `<div class="todolist">${rows.map((i) => todoRow(i, readOnly)).join("")}</div>`;
  let openHtml;
  if (!open.length) {
    openHtml = readOnly ? "" : `<div class="empty"><b>${esc(T.allDoneTitle)}</b>${esc(T.allDoneText)}</div>`;
  } else if (!today.length && !upcoming.length) {
    openHtml = block(anytime); // une simple liste, sans titres, tant que rien n'est daté
  } else {
    const section = (label, rows, cls = "") => (rows.length ? `<div class="subhead label ${cls}">${esc(label)}</div>${block(rows)}` : "");
    openHtml = section(T.secToday, today, "today") + section(T.secUpcoming, upcoming) + section(T.secAnytime, anytime);
  }
  const showDone = readOnly || S.showDone;
  const doneHtml = done.length ? `
    <div class="donehead">
      ${readOnly ? `<span class="label">${esc(T.doneCount(done.length))}</span>` : `<button class="linkbtn" data-a="toggle-done">${esc(S.showDone ? T.hideDone : T.doneCount(done.length))}</button>`}
      ${!readOnly && S.showDone ? `<button class="linkbtn muted" data-a="clear-done">${esc(T.clearDone)}</button>` : ""}
    </div>
    ${showDone ? block(done) : ""}` : "";
  return (readOnly ? "" : todoAddHtml()) + openHtml + doneHtml;
}

function nudgeHtml() {
  if (S.cat !== "all" || S.q || S.items.length < 5 || ls.get("glane-nudge") || !pushSupported()) return "";
  if (Notification.permission !== "default") return "";
  return `<div class="nudge">
    <div class="nudge-ic">${icon("sparkles", 20)}</div>
    <div class="nudge-tx"><b>${esc(T.nudgeTitle)}</b><span>${esc(T.nudgeText)}</span>
      <div class="nudge-row"><button class="btn sm" data-a="push-on">${esc(T.dailyOn)}</button><button class="linkbtn" data-a="nudge-dismiss">${esc(T.notNow)}</button></div>
    </div>
  </div>`;
}

function grid(list, showBoard) {
  return `<div class="grid">${list.map((i) => card(i, showBoard)).join("")}</div>`;
}

function textCard(i, dated = false) {
  const host = hostOf(i.url);
  const fav = host ? `<img class="fav" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64" alt="" onerror="this.classList.add('broken')">` : "<span></span>";
  return `<div class="textcard ${dated ? "dated" : ""}">${fav}<div class="t">${esc(titleOf(i))}</div></div>`;
}

function remindBadge(i) {
  if (!i.remind_on || i.archived_at) return "";
  return `<div class="remindbadge ${reminderDue(i) ? "due" : ""}">${icon("bell", 12, 2)}${esc(shortDate(i.remind_on))}</div>`;
}

function dateBadge(i) {
  if (!i.event_date) return "";
  const d = dateParts(i.event_date);
  return `<div class="datebadge"><b>${d.day}</b><span>${esc(d.month)}</span></div>`;
}

function card(i, showBoard) {
  const b = boardOf(i);
  const t = titleOf(i);
  const archivedWhen = i.archived_at ? new Date(i.archived_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
  const kicker = [showBoard ? b.name : "", archivedWhen ? T.archivedOn(archivedWhen) : "", !archivedWhen && i.type === "link" ? i.site || hostOf(i.url) : ""].filter(Boolean).join(" · ");
  const kick = kicker ? `<div class="label">${esc(kicker)}</div>` : "";
  let media;
  let cap = "";
  if (i.image_url) {
    media = `<div class="media" style="--tint:${esc(b.color)}">${img(i.image_url, "full")}${dateBadge(i)}${remindBadge(i)}</div>`;
    const capText = i.type === "text" ? noteText(i, 140) : t;
    if (kick || capText) {
      cap = `<div class="cap">${kick}${capText ? `<div class="t">${esc(i.type === "text" ? capText : clip(capText, 90))}</div>` : ""}</div>`;
    }
  } else if (i.type === "text") {
    media = `<div class="media" style="--tint:${esc(b.color)}"><div class="quote ${i.event_date ? "dated" : ""} ${isQuoteItem(i) ? "" : "plain"}">${esc(noteText(i, 260))}</div>${dateBadge(i)}${remindBadge(i)}</div>`;
    const by = cleanTitle(i.title);
    const textKick = [showBoard ? b.name : "", archivedWhen ? T.archivedOn(archivedWhen) : ""].filter(Boolean).join(" · ");
    if (textKick || by) cap = `<div class="cap">${textKick ? `<div class="label">${esc(textKick)}</div>` : ""}${by ? `<div class="n">${esc(by)}</div>` : ""}</div>`;
  } else {
    media = `<div class="media" style="--tint:${esc(b.color)}">${textCard(i, !!i.event_date)}${dateBadge(i)}${remindBadge(i)}</div>`;
    if (kick) cap = `<div class="cap">${kick}</div>`;
  }
  return `<div class="item ${isPast(i) ? "past" : ""}" role="button" tabindex="0" data-a="item" data-id="${i.id}">${media}${cap}</div>`;
}

// ---------- Panneaux ----------
function openSheet(s) {
  S.sheet = s;
  renderSheet();
}

function closeSheet() {
  S.sheet = S.sheet && S.sheet.parent ? S.sheet.parent : null;
  renderSheet();
}

function renderSheet() {
  const el = document.getElementById("sheet");
  if (!el) return;
  const s = S.sheet;
  if (!s) {
    el.innerHTML = "";
    document.documentElement.classList.remove("locked");
    return;
  }
  const views = { add: addSheet, pick: pickSheet, detail: detailSheet, board: boardSheet, account: accountSheet, filters: filtersSheet, revisit: revisitSheet, share: shareSheet, pubitem: pubitemSheet, archived: archivedSheet };
  el.innerHTML = `<div class="sheetbg" data-a="backdrop"><div class="sheet ${s.shown ? "still" : ""}" role="dialog" aria-modal="true"><div class="grab"></div>${views[s.kind](s)}</div></div>`;
  s.shown = true;
  document.documentElement.classList.add("locked");
}

function addSheet() {
  return `
    <p class="ask">${esc(T.addTitle)}</p>
    <button class="btn wide" data-a="paste">${esc(T.pasteLink)}</button>
    <p class="note">${esc(T.pasteHint)}</p>
    <div class="row" style="margin-top:14px"><button class="btn ghost wide" data-a="photo">${esc(T.pickPhoto)}</button></div>
    <div class="lbl label">${esc(T.orPaste)}</div>
    <textarea id="addtext" class="input" rows="3" placeholder="${esc(T.addPh)}"></textarea>
    <div class="row">
      <button class="btn" data-a="add-next">${esc(T.next)}</button>
      <button class="btn ghost" data-a="close">${esc(T.cancel)}</button>
    </div>`;
}

function openPick(p) {
  if (!p) return;
  const view = S.cat !== "all" && S.cat !== "__none" ? S.cat : null;
  const s = {
    kind: "pick", payload: p, step: "boards", boardId: null, suggest: view,
    title: "", note: "", event_date: "", remind_on: "", more: false, saving: false,
    preview: null, previewState: p.kind === "link" ? "loading" : "none", attach: null,
  };
  openSheet(s);
  if (p.kind === "link") {
    api("preview?url=" + encodeURIComponent(p.url))
      .then((pr) => { s.preview = pr; s.previewState = "done"; })
      .catch(() => { s.previewState = "fail"; })
      .finally(() => {
        const pv = document.getElementById("pv");
        if (S.sheet === s && pv) pv.innerHTML = pickPreview(s);
      });
  }
}

function pickPreview(s) {
  const p = s.payload;
  if (p.kind === "image") return `<img class="big" src="${p.dataUrl}" alt="">`;
  if (p.kind === "text") return `<div class="quote plain" style="background:var(--bg)">${esc(clip(p.text, 400))}</div>`;
  const host = hostOf(p.url);
  if (s.attach) {
    return `<figure class="pvfig"><img class="big" src="${s.attach.dataUrl}" alt="">
      <div class="label">${esc(host)}</div>
      <div class="row" style="justify-content:center;margin-top:4px;gap:18px"><button class="linkbtn" data-a="attach">${esc(T.changeShot)}</button><button class="linkbtn" data-a="paste-attach">${esc(T.paste)}</button></div></figure>`;
  }
  if (s.previewState === "loading") {
    return `<div class="nopv"><div class="loader"></div><div class="t">${esc(host)}</div><p>${esc(T.searching)}</p></div>`;
  }
  const pr = s.preview || {};
  const title = cleanTitle(pr.title);
  if (pr.image) {
    return `<figure class="pvfig">${img(pr.image, "big")}<div class="label">${esc(pr.site || host)}</div>${title ? `<div class="t">${esc(clip(title, 90))}</div>` : ""}</figure>`;
  }
  return `<div class="nopv">
    <div class="label">${esc(pr.site || host)}</div>
    <div class="t">${esc(title || T.noPreview)}</div>
    <p>${esc(T.noPreviewHint)}</p>
    <div class="row" style="justify-content:center;margin-top:0">
      <button class="btn sm" data-a="attach">${esc(T.addShot)}</button>
      <button class="btn ghost sm" data-a="paste-attach">${esc(T.paste)}</button>
    </div>
  </div>`;
}

function pickSheet(s) {
  const pv = `<div id="pv" class="pv">${pickPreview(s)}</div>`;
  if (s.saving) {
    return `${pv}<p class="ask">${esc(T.saving)}</p><p class="note">${esc(s.payload.kind === "link" ? T.savingLink : T.savingOther)}</p>`;
  }
  if (s.step === "date") {
    const b = boardById(s.boardId);
    return `${pv}
      <div class="label">${esc(b.name)}</div>

      <input class="input" type="date" data-field="event_date" value="${esc(s.event_date)}">

        <button class="btn" data-a="save-date">${esc(T.saveDate)}</button>

      <div class="lbl label">${esc(T.remindMe)}</div>

}

function choosePickBoard(board) {
  const s = S.sheet;
  if (!s || s.kind !== "pick") return;
  if (board && isEventsBoard(board)) {
    s.step = "date";
    s.boardId = board.id;
    renderSheet();
    return;
  }
  save(board ? board.id : null, board);
}

async function save(boardId, boardHint) {
  const s = S.sheet && S.sheet.kind === "pick" ? S.sheet : null;
  if (!s || s.saving) return;
  s.saving = true;
  renderSheet();
  const p = s.payload;
  const body = {
    board_id: boardId || null,
    title: s.title.trim() || null,
    note: s.note.trim() || null,
    event_date: s.event_date || null,
    remind_on: s.remind_on || null,
  };
  if (p.kind === "link") {
    body.url = p.url;
    if (s.preview && !s.preview.isImage && (s.preview.image || s.preview.title)) body.preview = s.preview;
    if (s.attach) body.image_base64 = s.attach.b64;
  }
  if (p.kind === "text") body.text = p.text;
  if (p.kind === "image") body.image_base64 = p.b64;
  try {
    const { item } = await api("items", { method: "POST", body });
    S.items.unshift(item);
    if (S.sheet === s) S.sheet = null;
    renderSheet();
    renderMain();
    const b = boardHint || S.boards.find((x) => x.id === boardId);
    toast((b ? T.savedIn(b) : T.savedLater) + (item.remind_on ? ". " + T.snoozed(inSentence(item.remind_on)) : ""));
  } catch (e) {
    if (e.status === 401) return;
    s.saving = false;
    if (S.sheet === s) renderSheet();
    toast(T.saveFail + e.message);
  }
}

function revisitSheet(s) {
  const i = S.items.find((x) => x.id === s.id);

  if (reminderDue(i)) return reminderSheet(i);
  const b = boardOf(i);

  return `

async function saveDisplayName(value) {
  const s = S.sheet && S.sheet.kind === "account" ? S.sheet : null;
  const name = String(value || "").trim();
  if (s && name === (s.displayName || "")) return;
  try {
    const d = await authCall({ action: "profile", display_name: name });
    if (s) s.displayName = d.display_name || "";
    toast(T.nameSaved);
  } catch (e) {
    handleErr(e);
  }
}

function dailyControls(s) {
  if (s.push === "install") return `<p class="note">${esc(T.dailyInstall)}</p>`;
  if (s.push === "unsupported") return `<p class="note">${esc(T.dailyUnsupported)}</p>`;
  if (s.push === "denied") return `<p class="note">${esc(T.dailyDenied)}</p>`;
  if (s.push === "on") {
    return `<p class="note">${esc(T.dailyActive)}</p><div class="row" style="margin-top:12px">
      <button class="btn sm" data-a="push-test" ${s.busy ? "disabled" : ""}>${esc(T.dailyTest)}</button>
      <button class="btn ghost sm" data-a="push-off" ${s.busy ? "disabled" : ""}>${esc(T.dailyOff)}</button></div>`;
  }
  if (s.push === "off") return `<div class="row" style="margin-top:12px"><button class="btn sm" data-a="push-on" ${s.busy ? "disabled" : ""}>${esc(T.dailyOn)}</button></div>`;
  return `<p class="note">…</p>`;
}

function openAccount() {
  const s = { kind: "account", email: (S.session && S.session.email) || "", key: null, armedKey: false, armedDelete: false, push: "…", busy: false, displayName: "", profileToken: null, profileLoaded: false, armedProfile: false };
  openSheet(s);
  pushState().then((st) => {
    s.push = st;
    if (S.sheet === s) renderSheet();
  });
  api("/api?route=auth")
    .then((d) => {
      s.key = d.share_key;
      if (d.email) s.email = d.email;
      s.displayName = d.display_name || "";
      s.profileToken = d.profile_token || null;
      s.profileLoaded = true;
      if (S.sheet === s) renderSheet();
    })
    .catch((e) => handleErr(e));
}

function accountSheet(s) {
  const link = s.key ? `${location.origin}/api/boards?format=lines&key=${s.key}` : "";
  return `
    <div class="label">${esc(T.signedInAs)}</div>
    <p class="acct">${esc(s.email)}</p>
    <div class="lbl label">${esc(T.publicProfile)}</div>
    ${profileControls(s)}
    <div class="lbl label">${esc(T.dailyTitle)}</div>
    <p class="note" style="margin-top:0">${esc(T.dailyNote)}</p>
    ${dailyControls(s)}
    <div class="lbl label">${esc(T.shortcutTitle)}</div>
    <input class="input keybox" readonly value="${esc(s.key || "…")}">
    <p class="note">${esc(T.shortcutNote)}</p>
    <div class="row">
      <button class="btn ghost sm" data-a="copy-key" ${s.key ? "" : "disabled"}>${esc(T.copyKey)}</button>
      <button class="btn ghost sm" data-a="copy-link" data-v="${esc(link)}" ${s.key ? "" : "disabled"}>${esc(T.copyLink)}</button>
      <button class="btn ${s.armedKey ? "danger" : "ghost"} sm" data-a="reset-key" ${s.key ? "" : "disabled"}>${esc(s.armedKey ? T.resetKeyConfirm : T.resetKey)}</button>
    </div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:22px;margin-top:28px">
      <button class="btn" data-a="sign-out">${esc(T.signOut)}</button>
      <button class="btn ${s.armedDelete ? "danger" : "ghost"}" data-a="delete-account">${esc(s.armedDelete ? T.deleteAccountConfirm : T.deleteAccount)}</button>
    </div>
    ${s.armedDelete ? `<p class="note">${esc(T.deleteNote)}</p>` : ""}`;
}

    if (!isTask(i)) {

      const before = i.remind_on;
      i.remind_on = null;
      renderMain();
      try {
        const { item } = await api("items?id=" + i.id, { method: "PATCH", body: { remind_on: null } });

      const { item } = await api("items?id=" + i.id, { method: "PATCH", body: { done } });

document.addEventListener("click", (e) => {
  if (e.target.matches && e.target.matches(".datechip input, #tododate") && e.target.showPicker) {
    try { e.target.showPicker(); } catch { /* le navigateur ouvre son propre calendrier */ }
  }
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;
  if (a === "backdrop") {
    if (e.target === el) closeSheet();
    return;
  }
  const fn = ACTIONS[a];
  if (fn) {
    e.preventDefault();
    fn(el);
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "todoinput") { S.todoDraft = e.target.value; return; }
  if (e.target.id === "tododate") {
    S.todoDate = e.target.value;
    S.todoDatePicker = false;
    renderFeed();
    return;
  }
  const d = e.target.dataset || {};
  if (d.auth) {
    S.authForm[d.auth] = e.target.value;
    return;
  }
  if (!d.field || !S.sheet) return;
  S.sheet[d.field] = e.target.value;
  if (d.field === "remind_on") return renderSheet();
  if (d.field === "name") {
    const b = document.getElementById("edname");
    if (b) b.textContent = e.target.value || T.boardDefault;
  }
});

document.addEventListener("change", (e) => {
  if (e.target.id === "dispname") saveDisplayName(e.target.value);
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.sheet) return closeSheet();
  if (e.key === "Enter") {
    if (e.target.dataset && e.target.dataset.auth) return submitAuth();
    if (e.target.id === "todoinput") { e.preventDefault(); return ACTIONS["todo-add"](); }
    const item = e.target.closest && e.target.closest('[data-a="item"]');
    if (item && e.target === item) openItem(item.dataset.id);
  }
});

$file.addEventListener("change", async () => {
  const f = $file.files[0];
  $file.value = "";
  if (!f) return;
  let dataUrl;
  try {
    dataUrl = await compress(f);
  } catch {
    return toast(T.imgFail);
  }
  const shot = { dataUrl, b64: dataUrl.split(",")[1] };
  const s = S.sheet;

  if (S.fileTarget === "attach" && s && s.kind === "pick") {
    s.attach = shot;
    const pv = document.getElementById("pv");
    if (pv) pv.innerHTML = pickPreview(s);
    return;
  }

  if (S.fileTarget === "replace" && s && s.kind === "detail") return setItemImage(s, shot);

  openPick({ kind: "image", ...shot });
});

// Sur ordinateur : coller ou glisser-déposer
async function intakeFile(file) {
  try {
    const dataUrl = await compress(file);
    openPick({ kind: "image", dataUrl, b64: dataUrl.split(",")[1] });
  } catch {
    toast(T.imgFail);
  }
}

window.addEventListener("paste", async (e) => {
  if (!S.session || S.publicMode) return;
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea";
  const cd = e.clipboardData;
  if (!cd) return;
  const file = [...(cd.files || [])].find((f) => f.type.startsWith("image/"));
  const s = S.sheet;
  // Une image collée va dans la carte ouverte, ou dans le lien en cours de rangement
  if (file && s && s.kind === "detail") { e.preventDefault(); return setItemImage(s, await toShot(file)); }
  if (file && s && s.kind === "pick" && s.payload.kind === "link" && !s.saving) {
    e.preventDefault();
    s.attach = await toShot(file);
    const pv = document.getElementById("pv");
    if (pv) pv.innerHTML = pickPreview(s);
    return;
  }
  if (typing || (s && s.kind !== "add")) return;
  if (file) { e.preventDefault(); S.sheet = null; return intakeFile(file); }
  const t = cd.getData("text/plain");
  if (t && t.trim()) { e.preventDefault(); S.sheet = null; openPick(parseInput(t)); }
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", async (e) => {
  e.preventDefault();
  if (!S.session || S.publicMode) return;
  const dt = e.dataTransfer;
  const s = S.sheet;
  const dropped = [...(dt.files || [])].find((f) => f.type.startsWith("image/"));
  if (dropped && s && s.kind === "detail") return setItemImage(s, await toShot(dropped));
  if (s) return;
  const file = [...(dt.files || [])].find((f) => f.type.startsWith("image/"));
  if (file) return intakeFile(file);
  const t = (dt.getData("text/uri-list") || "").split(/\r?\n/).find((l) => l && !l.startsWith("#")) || dt.getData("text/plain");
  if (t) openPick(parseInput(t));
});

// Toute erreur « déconnectée » non capturée ne doit pas polluer la console
window.addEventListener("unhandledrejection", (e) => {
  if (e.reason && e.reason.status === 401) e.preventDefault();
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
start();
</script>
