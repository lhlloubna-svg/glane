<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glane</title>
<meta name="description" content="Everything that inspires you, in boards">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F3F2EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Glane">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2EF;--paper:#FFFFFF;--ink:#1C1A19;--muted:#85807A;--line:#E2DFDA;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html.locked,html.locked body{overflow:hidden}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
button{font:inherit;color:inherit}
.app{max-width:1280px;margin:0 auto;min-height:100vh;padding:calc(22px + env(safe-area-inset-top)) clamp(18px,5vw,56px) calc(130px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
/* Les textes longs sans espace (liens, identifiants) passent à la ligne au lieu d'élargir la page */
.item,.cap,.quote,.coverquote,.textcard,.nopv,.pvfig,.dmeta,.bname,.boardhead h1,.edprev,.tileb,.toast{overflow-wrap:anywhere;min-width:0}
.label{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Barre du haut */
.bar{display:flex;align-items:center;gap:16px;margin-bottom:44px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:38px;line-height:1;background:none;border:0;padding:0;cursor:pointer;letter-spacing:-.01em}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);height:40px;width:min(340px,100%);color:var(--muted)}
.search:focus-within{border-color:var(--ink)}
.search input{border:0;outline:0;font:inherit;font-size:16px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}

/* Accueil */
.intro{padding:8px 0 44px;max-width:620px}
.intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,7vw,68px);line-height:1;margin:0 0 16px;letter-spacing:-.015em}
.intro p{color:var(--muted);font-size:15.5px;line-height:1.6;margin:0 0 24px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 18px}
.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 14px;margin-bottom:64px}
@media (min-width:520px){.boards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:30px 18px}}
@media (min-width:700px){.boards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:36px 24px}}
.board{border:0;background:none;padding:0;text-align:left;cursor:pointer}
.cover{aspect-ratio:4/5;border-radius:16px;overflow:hidden;display:grid;grid-template:1fr/1fr;transition:transform .35s ease}
.board:hover .cover{transform:translateY(-3px)}
.board:active .cover{transform:scale(.98)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover img.broken{visibility:hidden}
.cover.c4{grid-template:1fr 1fr/1fr 1fr;gap:2px}
.cover.center{place-items:center}
.cover .emo{font-size:40px;line-height:1;opacity:.9}
.coverquote{font-family:var(--serif);font-size:20px;line-height:1.12;padding:20px;align-self:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.bname{font-family:var(--serif);font-size:25px;line-height:1.05;margin-top:12px;display:flex;align-items:baseline;gap:7px}
.bname small{font-family:var(--sans);font-size:14px}
.bcount{margin-top:4px}
.newboard .cover{border:1px dashed #CFCAC3;color:var(--muted)}

/* Grille de contenus */
.grid{columns:2;column-gap:14px}
@media (min-width:700px){.grid{columns:230px;column-gap:24px}}
.item{break-inside:avoid;margin-bottom:28px;cursor:pointer;display:block}
.media{border-radius:14px;overflow:hidden;position:relative}
.media img.full{width:100%;display:block;transition:transform .5s ease}
.item:hover .media img.full{transform:scale(1.02)}
.media img.broken{display:none}
.media.bare{min-height:120px}
.cap{padding:10px 2px 0}
.cap .t{font-family:var(--serif);font-size:18px;line-height:1.15;margin-top:4px;word-break:break-word}
.cap .p{font-size:12.5px;font-weight:600;margin-top:5px}
.cap .n{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.quote{padding:26px 20px 30px;font-family:var(--serif);font-size:23px;line-height:1.14;word-break:break-word}
.quote.dated,.textcard.dated{padding-top:72px}
.textcard{padding:22px 18px 20px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:26px}
.fav{width:26px;height:26px;border-radius:7px;background:#fff;padding:4px}
.fav.broken{visibility:hidden}
.textcard .t{font-family:var(--serif);font-size:23px;line-height:1.04;word-break:break-word}
.datebadge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.95);border-radius:10px;padding:6px 9px 5px;text-align:center;line-height:1;min-width:44px}
.datebadge b{display:block;font-family:var(--serif);font-weight:400;font-size:22px}
.datebadge span{display:block;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.item.past{opacity:.45}

/* Page d'un tableau */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;cursor:pointer;padding:0;margin-bottom:22px}
.boardhead{border-radius:22px;padding:clamp(24px,5vw,44px);margin-bottom:36px;position:relative;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end}
.boardhead .emo{font-size:34px;line-height:1;margin-bottom:10px}
.boardhead h1{font-family:var(--serif);font-weight:400;font-size:clamp(52px,10vw,104px);line-height:.92;margin:0;letter-spacing:-.02em;word-break:break-word}
.boardhead .meta{margin-top:12px;color:var(--ink);opacity:.6}
.editb{position:absolute;top:18px;right:18px;border:0;background:rgba(255,255,255,.6);border-radius:999px;padding:8px 14px;cursor:pointer}
.subhead{margin:6px 0 16px}
.empty{border:1px dashed #CFCAC3;border-radius:18px;padding:56px 22px;text-align:center;color:var(--muted);line-height:1.6}

/* Boutons */
.btn{height:46px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:14.5px;font-weight:600;padding:0 22px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap;text-decoration:none}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:#B4453A}
.btn.wide{width:100%}
.btn.sm{height:38px;padding:0 15px;font-size:13.5px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 28px rgba(28,26,25,.22);z-index:30}

/* Panneaux */
.sheetbg{position:fixed;inset:0;background:rgba(28,26,25,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:min(600px,100%);border-radius:26px 26px 0 0;padding:12px 22px calc(28px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;overscroll-behavior:contain;animation:up .24s ease-out;-webkit-overflow-scrolling:touch}
.sheet.still{animation:none}
@media (min-width:720px){.sheetbg{align-items:center;padding:24px}.sheet{border-radius:26px;padding:14px 30px 30px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 18px}
.pv{display:flex;justify-content:center;margin-bottom:20px}
.pv img.big{max-height:300px;max-width:100%;border-radius:14px;display:block;background:var(--bg)}
.pv .quote,.pv .textcard{border-radius:16px;width:100%;min-height:0}
.pv .quote{max-height:280px;overflow:auto}
.pvfig{margin:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pvfig .t{font-family:var(--serif);font-size:20px;line-height:1.15;margin-top:6px}
.pvfig .p{font-size:13px;font-weight:600}
.nopv{width:100%;border-radius:16px;background:var(--bg);padding:22px;text-align:center}
.nopv .t{font-family:var(--serif);font-size:22px;line-height:1.1;margin:6px 0 8px}
.nopv p{margin:0 0 14px;color:var(--muted);font-size:14px}
.loader{width:26px;height:26px;border-radius:50%;border:2px solid rgba(28,26,25,.12);border-top-color:var(--ink);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.ask{font-family:var(--serif);font-size:32px;line-height:1;margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tileb{border:0;border-radius:14px;padding:16px 4px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;word-break:break-word;text-align:center}
.tileb:active{transform:scale(.96)}
.tileb .e{font-size:26px;line-height:1}
.tileb.sug{box-shadow:0 0 0 1.5px var(--ink)}
.tileb.add{background:transparent;box-shadow:inset 0 0 0 1px #CFCAC3;color:var(--muted)}
.more{margin-top:18px}
.input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 2px;font:inherit;font-size:16px;outline:0;background:transparent;color:var(--ink);margin-top:8px;display:block}
.input:focus{border-color:var(--ink)}
textarea.input{resize:vertical;min-height:56px;line-height:1.5}
input[type=date].input{min-height:46px}
.lbl{margin:22px 0 8px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:12px;border:0;background:var(--bg);font-size:21px;cursor:pointer}
.emojis button.on{box-shadow:0 0 0 1.5px var(--ink);background:#fff}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;border:0;cursor:pointer}
.swatches button.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;background:var(--bg)}
.seg button.on{background:var(--ink);color:#fff}
.edprev{border-radius:18px;padding:20px;display:flex;align-items:center;gap:14px;font-family:var(--serif);font-size:30px;line-height:1}
.edprev span{font-size:34px}
.edprev b{font-weight:400}
.moveto{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.moveto button{flex:none;border:0;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer}
.moveto button.on{box-shadow:0 0 0 1.5px var(--ink)}
.dmeta{text-align:center;margin:-6px 0 6px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;z-index:60;font-size:14px;max-width:calc(100vw - 40px);text-align:center}
.codebox{max-width:360px;margin:18vh auto 0;text-align:center}
.codebox .brand{font-size:76px;display:block;margin:0 auto 14px}
.codebox p{color:var(--muted);line-height:1.6}
.codebox .btn{margin-top:18px;width:100%}
.err{color:#B4453A;font-size:14px;min-height:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
"use strict";

// ---------- Textes de l'interface (tout est ici pour changer de langue facilement) ----------
const T = {
  searchPh: "Search: ring, pasta, Rumi…",
  boards: "Boards",
  recent: "Recently saved",
  unsorted: "Unsorted",
  newBoard: "New board",
  createBoard: "Create a board",
  empty: "Empty",
  items: (n) => `${n} item${n === 1 ? "" : "s"}`,
  toSort: (n) => `${n} to sort`,
  upcomingCount: (n) => `${n} upcoming`,
  introTitle: "Keep everything that inspires you.",
  introText: "A ring you spotted online, a recipe, a quote, an Instagram screenshot. Share it to Glane from any app, or tap +.",
  add: "Add",
  loading: "Opening your library…",
  results: (n) => (n ? `${n} result${n === 1 ? "" : "s"}` : "Nothing found"),
  noResults: "Try another word, or a board name.",
  back: "Boards",
  edit: "Edit",
  emptyBoard: "This board is empty. Share a link or a photo to Glane, or tap +.",
  upcoming: "Upcoming",
  undated: "No date yet",
  past: "Past",
  codeIntro: "Enter your access code to open your library.",
  codePh: "Access code",
  enter: "Enter",
  codeBad: "Wrong code, try again.",
  unreachable: "Server unreachable: ",
  addTitle: "Add",
  pickPhoto: "Choose a photo or screenshot",
  orPaste: "Or paste a link, a quote, an idea",
  addPh: "https://… or “What is meant for you will not pass you by”",
  next: "Continue",
  cancel: "Cancel",
  searching: "Looking for the image…",
  noPreview: "This site doesn't share a preview",
  noPreviewHint: "Add a screenshot so the card looks right.",
  addShot: "Add a screenshot",
  changeShot: "Change screenshot",
  where: "Where does it go?",
  details: "Add a title or a note",
  hideDetails: "Hide details",
  titlePh: "Title",
  authorPh: "Author",
  notePh: "Why you're keeping it",
  later: "Save for later",
  saving: "Saving…",
  savingLink: "Keeping a copy of the image and product details.",
  savingOther: "Uploading.",
  when: "When is it?",
  saveDate: "Save",
  noDate: "No date yet",
  savedIn: (b) => `Saved to ${b.emoji} ${b.name}`,
  savedLater: "Saved to 📥 Unsorted",
  saveFail: "Couldn't save: ",
  gone: "This item no longer exists.",
  date: "Date",
  board: "Board",
  save: "Save",
  open: "Open",
  del: "Delete",
  confirm: "Confirm",
  replaceImg: "Replace image",
  addImg: "Add an image",
  refresh: "Retry preview",
  refreshing: "Retrying…",
  refreshed: "Preview updated",
  refreshNone: "Still no preview for this site. Add a screenshot instead.",
  imgUpdated: "Image updated",
  saved: "Saved",
  deleted: "Deleted",
  failed: "Failed: ",
  editBoard: "Edit board",
  newBoardT: "New board",
  boardPh: "e.g. Jewellery, Recipes, Skincare",
  boardDefault: "Board name",
  emoji: "Emoji",
  color: "Color",
  type: "Type",
  typeCollection: "Collection",
  typeEvents: "Events, with dates",
  create: "Create",
  delBoard: "Delete board",
  delBoardConfirm: "Confirm delete",
  nameIt: "Give the board a name",
  boardDeleted: "Board deleted. Its items are in 📥 Unsorted.",
  typeSomething: "Paste a link or write something",
  imgFail: "Couldn't read this image",
  loadFail: "Couldn't load: ",
  link: "Link",
};

const COLORS = ["#E4D3CC", "#DCC2A6", "#BEC7B4", "#CACFD8", "#CDD4BA", "#D8CFE0", "#E3CFAE", "#C9D6D3", "#D9CBBF", "#BFC6CF"];
const EMOJIS = ["👗", "👠", "💄", "💍", "👜", "🍝", "🥑", "🍰", "☕", "📚", "📖", "💬", "✍️", "💪", "🧘", "🏃", "🥗", "🕊️", "✨", "🌙", "🙏", "🎟️", "🎉", "✈️", "🏝️", "🪴", "🏡", "🎨", "🎬", "🎵", "💡", "🎁"];
const NONE = { id: null, name: T.unsorted, emoji: "📥", color: "#E2DFDA", kind: "collection" };
const BLOCKED = /^\s*(access denied|just a moment|attention required|403 forbidden|forbidden|are you a robot|pardon our interruption|verify you are human|robot check|request unsuccessful|security check|captcha|not acceptable|site maintenance|page not found|service unavailable|bad gateway|error\s*\d{3}|\d{3}\s*(error|forbidden|not found))\s*($|[|:!.\u2013\u2014-])/i;

const svg = (d, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  plus: svg('<path d="M12 5v14M5 12h14"/>', 24),
  plusS: svg('<path d="M12 5v14M5 12h14"/>', 16),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', 17),
  back: svg('<path d="m15 18-6-6 6-6"/>', 15),
  photo: svg('<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/>', 17),
  x: svg('<path d="M6 6l12 12M18 6 6 18"/>', 14),
};

const ls = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* stockage indisponible */ } },
};

const S = { code: ls.get("glane-code"), boards: [], items: [], view: "home", q: "", loading: false, sheet: null, fileTarget: "new", pending: readShare() };
const $app = document.getElementById("app");
const $file = document.getElementById("file");
let toastTimer = null;

// ---------- Outils ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const clip = (s, n) => (s && s.length > n ? s.slice(0, n).trimEnd() + "…" : s || "");
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
const boardById = (id) => S.boards.find((b) => b.id === id) || NONE;
const boardOf = (i) => boardById(i.board_id || null);
const isEventsBoard = (b) => !!b && b.kind === "events";
const itemsOf = (id) => S.items.filter((i) => (i.board_id || null) === id);
const cleanTitle = (t) => (t && !BLOCKED.test(t) ? t : "");
const titleOf = (i) => cleanTitle(i.title) || (i.type === "link" ? hostOf(i.url) || T.link : "");
const img = (src, cls = "") => `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('broken')">`;
const pad = (n) => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dateParts = (iso) => {
  const d = new Date(iso + "T00:00:00");
  return { day: d.getDate(), month: d.toLocaleDateString("en-GB", { month: "short" }), long: d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "long", year: "numeric" }) };
};
const isPast = (i) => !!i.event_date && i.event_date < today();

function readShare() {
  const p = new URLSearchParams(location.search);
  const url = p.get("url"), text = p.get("text"), title = p.get("title");
  if (!url && !text && !title) return null;
  history.replaceState(null, "", "/");
  return parseInput([url, text, title].filter(Boolean).join(" "), text || title);
}

function parseInput(raw, fallbackText) {
  const t = String(raw || "").trim();
  if (!t) return null;
  const m = t.match(/https?:\/\/[^\s<>"]+/);
  if (m && t.replace(m[0], "").trim().length < 120) return { kind: "link", url: m[0].replace(/[)\].,;!?»"']+$/, "") };
  return { kind: "text", text: (fallbackText || t).trim() };
}

async function api(path, opts = {}) {
  const r = await fetch("/api/" + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", "x-glane-code": S.code || "" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(data.error || `Error ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return data;
}

function toast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ""; }, 3500);
}

function compress(file, max = 1400, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const im = new Image();
      im.onerror = reject;
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * s);
        c.height = Math.round(im.height * s);
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(im, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function pickFile(target) {
  S.fileTarget = target;
  $file.click();
}

function replaceItem(item) {
  S.items = S.items.map((x) => (x.id === item.id ? item : x));
}

function handleErr(e, prefix = T.failed) {
  if (e.status === 401) return logout();
  toast(prefix + e.message);
}

// ---------- Démarrage et code d'accès ----------
function renderCode(errMsg = "") {
  S.sheet = null;
  document.documentElement.classList.remove("locked");
  $app.innerHTML = `
    <div class="codebox">
      <span class="brand">glane</span>
      <p>${esc(T.codeIntro)}</p>
      <input id="code" class="input" type="password" autocomplete="current-password" placeholder="${esc(T.codePh)}">
      <button class="btn" data-a="code-ok">${esc(T.enter)}</button>
      <p id="codeerr" class="err">${esc(errMsg)}</p>
    </div>`;
}

function logout(msg) {
  S.code = "";
  ls.set("glane-code", "");
  renderCode(msg || T.codeBad);
}

function shell() {
  $app.innerHTML = `
    <header class="bar">
      <button class="brand" data-a="home">glane</button>
      <label class="search">${ICON.search}<input id="q" type="search" placeholder="${esc(T.searchPh)}" autocomplete="off" enterkeyhint="search"></label>
    </header>
    <main id="main"></main>
    <button class="fab" data-a="add" aria-label="${esc(T.add)}">${ICON.plus}</button>
    <div id="sheet"></div>
    <div id="toast"></div>`;
  document.getElementById("q").addEventListener("input", (e) => { S.q = e.target.value; renderMain(); });
}

async function start() {
  if (!S.code) return renderCode("");
  shell();
  S.loading = true;
  renderMain();
  const ok = await load();
  if (ok && S.pending) {
    const p = S.pending;
    S.pending = null;
    openPick(p);
  }
}

async function load() {
  try {
    const [b, i] = await Promise.all([api("boards"), api("items")]);
    S.boards = b.boards || [];
    S.items = i.items || [];
    return true;
  } catch (e) {
    if (e.status === 401) { logout(); return false; }
    toast(T.loadFail + e.message);
    return false;
  } finally {
    S.loading = false;
    renderMain();
  }
}

// ---------- Vues principales ----------
function renderMain() {
  const main = document.getElementById("main");
  if (!main) return;
  if (S.loading && !S.items.length) {
    main.innerHTML = `<p class="label">${esc(T.loading)}</p>`;
    return;
  }
  const q = norm(S.q);
  if (q) {
    const words = q.split(/\s+/);
    const res = S.items.filter((i) => {
      const hay = norm([titleOf(i), i.url, i.text, i.note, i.site, i.price, boardOf(i).name].join(" "));
      return words.every((w) => hay.includes(w));
    });
    main.innerHTML = `<div class="sechead"><span class="label">${esc(T.results(res.length))}</span></div>`
      + (res.length ? grid(res, true) : `<div class="empty">${esc(T.noResults)}</div>`);
    return;
  }
  if (S.view === "home") {
    main.innerHTML = homeHtml();
    return;
  }
  const b = S.view === "__none" ? NONE : S.boards.find((x) => x.id === S.view);
  if (!b) {
    S.view = "home";
    return renderMain();
  }
  main.innerHTML = boardHtml(b);
}

function homeHtml() {
  let h = "";
  if (!S.items.length) {
    h += `<section class="intro">
      <h1>${esc(T.introTitle)}</h1>
      <p>${esc(T.introText)}</p>
      <button class="btn" data-a="add">${ICON.plusS}${esc(T.add)}</button>
    </section>`;
  }
  h += `<div class="sechead"><span class="label">${esc(T.boards)}</span></div><div class="boards">`;
  for (const b of S.boards) {
    const its = itemsOf(b.id);
    const upcoming = isEventsBoard(b) ? its.filter((i) => i.event_date && !isPast(i)).length : 0;
    const count = !its.length ? T.empty : isEventsBoard(b) && upcoming ? T.upcomingCount(upcoming) : T.items(its.length);
    h += `<button class="board" data-a="board" data-id="${b.id}">${cover(b, its)}
      <div class="bname"><small>${esc(b.emoji)}</small>${esc(b.name)}</div>
      <div class="bcount label">${esc(count)}</div></button>`;
  }
  const none = itemsOf(null);
  if (none.length) {
    h += `<button class="board" data-a="board" data-id="__none">${cover(NONE, none)}
      <div class="bname"><small>${NONE.emoji}</small>${esc(NONE.name)}</div>
      <div class="bcount label">${esc(T.toSort(none.length))}</div></button>`;
  }
  h += `<button class="board newboard" data-a="new-board"><div class="cover center">${ICON.plus}</div>
    <div class="bname">${esc(T.newBoard)}</div><div class="bcount label">${esc(T.createBoard)}</div></button></div>`;
  if (S.items.length) {
    h += `<div class="sechead"><span class="label">${esc(T.recent)}</span></div>` + grid(S.items.slice(0, 40), true);
  }
  return h;
}

function boardHtml(b) {
  const items = itemsOf(b.id);
  let body;
  if (!items.length) {
    body = `<div class="empty">${esc(T.emptyBoard)}</div>`;
  } else if (isEventsBoard(b)) {
    const up = items.filter((i) => i.event_date && !isPast(i)).sort((x, y) => x.event_date.localeCompare(y.event_date));
    const undated = items.filter((i) => !i.event_date);
    const past = items.filter(isPast).sort((x, y) => y.event_date.localeCompare(x.event_date));
    const section = (label, list) => (list.length ? `<div class="subhead label">${esc(label)}</div>${grid(list, false)}` : "");
    body = section(T.upcoming, up) + section(T.undated, undated) + section(T.past, past);
  } else {
    body = grid(items, false);
  }
  return `
    <button class="back label" data-a="home">${ICON.back}${esc(T.back)}</button>
    <div class="boardhead" style="background:${esc(b.color)}">
      <span class="emo">${esc(b.emoji)}</span>
      <h1>${esc(b.name)}</h1>
      <div class="meta label">${esc(T.items(items.length))}</div>
      ${b.id ? `<button class="editb label" data-a="edit-board" data-id="${b.id}">${esc(T.edit)}</button>` : ""}
    </div>
    ${body}`;
}

function cover(b, its) {
  const bg = `style="background:${esc(b.color)}"`;
  const pics = its.map((i) => i.image_url).filter(Boolean).slice(0, 4);
  if (pics.length >= 4) return `<div class="cover c4" ${bg}>${pics.map((p) => img(p)).join("")}</div>`;
  if (pics.length) return `<div class="cover" ${bg}>${img(pics[0])}</div>`;
  const q = its.find((i) => i.type === "text");
  if (q) return `<div class="cover" ${bg}><div class="coverquote">“${esc(clip(q.text, 140))}”</div></div>`;
  return `<div class="cover center" ${bg}><span class="emo">${esc(b.emoji)}</span></div>`;
}

function grid(list, showBoard) {
  return `<div class="grid">${list.map((i) => card(i, showBoard)).join("")}</div>`;
}

function textCard(i, dated = false) {
  const host = hostOf(i.url);
  const fav = host ? `<img class="fav" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64" alt="" onerror="this.classList.add('broken')">` : "<span></span>";
  return `<div class="textcard ${dated ? "dated" : ""}">${fav}<div class="t">${esc(titleOf(i))}</div></div>`;
}

function dateBadge(i) {
  if (!i.event_date) return "";
  const d = dateParts(i.event_date);
  return `<div class="datebadge"><b>${d.day}</b><span>${esc(d.month)}</span></div>`;
}

function card(i, showBoard) {
  const b = boardOf(i);
  const t = titleOf(i);
  const kicker = [showBoard ? `${b.emoji} ${b.name}` : "", i.type === "link" ? i.site || hostOf(i.url) : ""].filter(Boolean).join(" · ");
  let media;
  let cap = "";
  if (i.image_url) {
    media = `<div class="media" style="background:${esc(b.color)}">${img(i.image_url, "full")}${dateBadge(i)}</div>`;
    if (kicker || (i.type !== "image" && t) || (i.type === "image" && t) || i.price) {
      cap = `<div class="cap">${kicker ? `<div class="label">${esc(kicker)}</div>` : ""}${t ? `<div class="t">${esc(clip(t, 90))}</div>` : ""}${i.price ? `<div class="p">${esc(i.price)}</div>` : ""}</div>`;
    }
  } else if (i.type === "text") {
    media = `<div class="media" style="background:${esc(b.color)}"><div class="quote ${i.event_date ? "dated" : ""}">“${esc(clip(i.text, 260))}”</div>${dateBadge(i)}</div>`;
    const by = cleanTitle(i.title);
    if (showBoard || by) cap = `<div class="cap">${showBoard ? `<div class="label">${esc(b.emoji + " " + b.name)}</div>` : ""}${by ? `<div class="n">${esc(by)}</div>` : ""}</div>`;
  } else {
    media = `<div class="media bare" style="background:${esc(b.color)}">${textCard(i, !!i.event_date)}${dateBadge(i)}</div>`;
    if (kicker || i.price) cap = `<div class="cap">${kicker ? `<div class="label">${esc(kicker)}</div>` : ""}${i.price ? `<div class="p">${esc(i.price)}</div>` : ""}</div>`;
  }
  return `<div class="item ${isPast(i) ? "past" : ""}" role="button" tabindex="0" data-a="item" data-id="${i.id}">${media}${cap}</div>`;
}

// ---------- Panneaux ----------
function openSheet(s) {
  S.sheet = s;
  renderSheet();
}

function closeSheet() {
  S.sheet = S.sheet && S.sheet.parent ? S.sheet.parent : null;
  renderSheet();
}

function renderSheet() {
  const el = document.getElementById("sheet");
  if (!el) return;
  const s = S.sheet;
  if (!s) {
    el.innerHTML = "";
    document.documentElement.classList.remove("locked");
    return;
  }
  const inner = s.kind === "add" ? addSheet() : s.kind === "pick" ? pickSheet(s) : s.kind === "detail" ? detailSheet(s) : boardSheet(s);
  el.innerHTML = `<div class="sheetbg" data-a="backdrop"><div class="sheet ${s.shown ? "still" : ""}" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`;
  s.shown = true;
  document.documentElement.classList.add("locked");
}

function addSheet() {
  return `
    <p class="ask">${esc(T.addTitle)}</p>
    <button class="btn wide" data-a="photo">${ICON.photo}${esc(T.pickPhoto)}</button>
    <div class="lbl label">${esc(T.orPaste)}</div>
    <textarea id="addtext" class="input" rows="3" placeholder="${esc(T.addPh)}"></textarea>
    <div class="row">
      <button class="btn" data-a="add-next">${esc(T.next)}</button>
      <button class="btn ghost" data-a="close">${esc(T.cancel)}</button>
    </div>`;
}

function openPick(p) {
  if (!p) return;
  const view = S.view !== "home" && S.view !== "__none" ? S.view : null;
  const s = {
    kind: "pick", payload: p, step: "boards", boardId: null, suggest: view,
    title: "", note: "", event_date: "", more: false, saving: false,
    preview: null, previewState: p.kind === "link" ? "loading" : "none", attach: null,
  };
  openSheet(s);
  if (p.kind === "link") {
    api("preview?url=" + encodeURIComponent(p.url))
      .then((pr) => { s.preview = pr; s.previewState = "done"; })
      .catch((e) => { if (e.status === 401) return logout(); s.previewState = "fail"; })
      .finally(() => {
        const pv = document.getElementById("pv");
        if (S.sheet === s && pv) pv.innerHTML = pickPreview(s);
      });
  }
}

function pickPreview(s) {
  const p = s.payload;
  if (p.kind === "image") return `<img class="big" src="${p.dataUrl}" alt="">`;
  if (p.kind === "text") return `<div class="quote" style="background:#CACFD8">“${esc(clip(p.text, 400))}”</div>`;
  const host = hostOf(p.url);
  if (s.attach) {
    return `<figure class="pvfig"><img class="big" src="${s.attach.dataUrl}" alt="">
      <div class="label">${esc(host)}</div>
      <button class="linkbtn" data-a="attach">${esc(T.changeShot)}</button></figure>`;
  }
  if (s.previewState === "loading") {
    return `<div class="nopv"><div class="loader"></div><div class="t">${esc(host)}</div><p>${esc(T.searching)}</p></div>`;
  }
  const pr = s.preview || {};
  const title = cleanTitle(pr.title);
  if (pr.image) {
    return `<figure class="pvfig">${img(pr.image, "big")}<div class="label">${esc(pr.site || host)}</div>${title ? `<div class="t">${esc(clip(title, 90))}</div>` : ""}${pr.price ? `<div class="p">${esc(pr.price)}</div>` : ""}</figure>`;
  }
  return `<div class="nopv">
    <div class="label">${esc(pr.site || host)}</div>
    <div class="t">${esc(title || T.noPreview)}</div>
    <p>${esc(title ? T.noPreview + ". " + T.noPreviewHint : T.noPreviewHint)}</p>
    <button class="btn sm" data-a="attach">${ICON.photo}${esc(T.addShot)}</button>
  </div>`;
}

function pickSheet(s) {
  const pv = `<div id="pv" class="pv">${pickPreview(s)}</div>`;
  if (s.saving) {
    return `${pv}<p class="ask">${esc(T.saving)}</p><p class="muted">${esc(s.payload.kind === "link" ? T.savingLink : T.savingOther)}</p>`;
  }
  if (s.step === "date") {
    const b = boardById(s.boardId);
    return `${pv}
      <div class="label">${esc(b.emoji + " " + b.name)}</div>
      <p class="ask" style="margin-top:8px">${esc(T.when)}</p>
      <input class="input" type="date" data-field="event_date" value="${esc(s.event_date)}">
      <div class="row">
        <button class="btn" data-a="save-date">${esc(T.saveDate)}</button>
        <button class="btn ghost" data-a="skip-date">${esc(T.noDate)}</button>
        <button class="btn line" data-a="back-boards">${ICON.back}</button>
      </div>`;
  }
  const tiles = S.boards.map((b) => `<button class="tileb ${s.suggest === b.id ? "sug" : ""}" style="background:${esc(b.color)}" data-a="pick" data-id="${b.id}"><span class="e">${esc(b.emoji)}</span>${esc(b.name)}</button>`).join("");
  const isText = s.payload.kind === "text";
  return `${pv}
    <p class="ask">${esc(T.where)}</p>
    <div class="tiles">${tiles}<button class="tileb add" data-a="new-board-pick"><span class="e">＋</span>${esc(T.newBoard)}</button></div>
    <button class="linkbtn more" data-a="more">${esc(s.more ? T.hideDetails : T.details)}</button>
    ${s.more ? `
      <input class="input" data-field="title" value="${esc(s.title)}" placeholder="${esc(isText ? T.authorPh : T.titlePh)}">
      <textarea class="input" rows="2" data-field="note" placeholder="${esc(T.notePh)}">${esc(s.note)}</textarea>` : ""}
    <div class="row">
      <button class="btn ghost" data-a="pick" data-id="">${esc(T.later)}</button>
      <button class="btn line" data-a="close">${esc(T.cancel)}</button>
    </div>`;
}

function choosePickBoard(board) {
  const s = S.sheet;
  if (!s || s.kind !== "pick") return;
  if (board && isEventsBoard(board)) {
    s.step = "date";
    s.boardId = board.id;
    renderSheet();
    return;
  }
  save(board ? board.id : null, board);
}

async function save(boardId, boardHint) {
  const s = S.sheet && S.sheet.kind === "pick" ? S.sheet : null;
  if (!s || s.saving) return;
  s.saving = true;
  renderSheet();
  const p = s.payload;
  const body = {
    board_id: boardId || null,
    title: s.title.trim() || null,
    note: s.note.trim() || null,
    event_date: s.event_date || null,
  };
  if (p.kind === "link") {
    body.url = p.url;
    if (s.preview && !s.preview.isImage && (s.preview.image || s.preview.title)) body.preview = s.preview;
    if (s.attach) body.image_base64 = s.attach.b64;
  }
  if (p.kind === "text") body.text = p.text;
  if (p.kind === "image") body.image_base64 = p.b64;
  try {
    const { item } = await api("items", { method: "POST", body });
    S.items.unshift(item);
    if (S.sheet === s) S.sheet = null;
    renderSheet();
    renderMain();
    const b = boardHint || S.boards.find((x) => x.id === boardId);
    toast(b ? T.savedIn(b) : T.savedLater);
  } catch (e) {
    if (e.status === 401) return logout();
    s.saving = false;
    if (S.sheet === s) renderSheet();
    toast(T.saveFail + e.message);
  }
}

function openDetail(id) {
  const i = S.items.find((x) => x.id === id);
  if (!i) return;
  openSheet({
    kind: "detail", id,
    title: cleanTitle(i.title), note: i.note || "", text: i.text || "",
    board_id: i.board_id || null, event_date: i.event_date || "",
    armed: false, busy: "",
  });
}

function detailSheet(s) {
  const i = S.items.find((x) => x.id === s.id);
  if (!i) return `<p>${esc(T.gone)}</p>`;
  const b = boardOf(i);
  const media = i.image_url
    ? img(i.image_url, "big")
    : i.type === "text"
      ? `<div class="quote" style="background:${esc(b.color)}">“${esc(i.text)}”</div>`
      : `<div style="width:100%;border-radius:16px;overflow:hidden;background:${esc(b.color)}">${textCard(i)}</div>`;
  const chosen = boardById(s.board_id);
  const showDate = isEventsBoard(chosen) || !!s.event_date;
  const chips = [...S.boards, NONE].map((x) => `<button class="${(s.board_id || null) === x.id ? "on" : ""}" style="background:${esc(x.color)}" data-a="detail-board" data-id="${x.id || ""}">${esc(x.emoji)} ${esc(x.name)}</button>`).join("");
  const meta = [i.price, i.site || hostOf(i.url), i.event_date ? dateParts(i.event_date).long : ""].filter(Boolean).join(" · ");
  const canRefresh = i.type === "link" && i.url && (!i.image_url || !cleanTitle(i.title));
  return `
    <div class="pv">${media}</div>
    ${meta ? `<p class="dmeta">${esc(meta)}</p>` : ""}
    ${i.type === "text" ? `<textarea class="input" rows="3" data-field="text">${esc(s.text)}</textarea>` : ""}
    <input class="input" data-field="title" value="${esc(s.title)}" placeholder="${esc(i.type === "text" ? T.authorPh : T.titlePh)}">
    <textarea class="input" rows="2" data-field="note" placeholder="${esc(T.notePh)}">${esc(s.note)}</textarea>
    ${showDate ? `<div class="lbl label">${esc(T.date)}</div><input class="input" type="date" data-field="event_date" value="${esc(s.event_date)}">` : ""}
    <div class="lbl label">${esc(T.board)}</div>
    <div class="moveto">${chips}</div>
    <div class="row">
      <button class="btn" data-a="detail-save">${esc(T.save)}</button>
      ${i.url ? `<a class="btn ghost" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(T.open)}</a>` : ""}
      ${i.type !== "text" ? `<button class="btn line" data-a="replace-img" ${s.busy ? "disabled" : ""}>${ICON.photo}${esc(i.image_url ? T.replaceImg : T.addImg)}</button>` : ""}
      ${canRefresh ? `<button class="btn line" data-a="refresh" ${s.busy ? "disabled" : ""}>${esc(s.busy === "refresh" ? T.refreshing : T.refresh)}</button>` : ""}
      <button class="btn ${s.armed ? "danger" : "line"}" data-a="detail-delete">${esc(s.armed ? T.confirm : T.del)}</button>
    </div>`;
}

function boardSheet(s) {

    <div class="edprev" id="edprev" style="background:${esc(s.color)}"><span>${esc(s.emoji)}</span><b>${esc(s.name || T.boardDefault)}</b></div>

    <div class="row">

}

const newBoardSheet = (parent) => ({ kind: "board", id: null, name: "", emoji: "✨", color: COLORS[S.boards.length % COLORS.length], boardKind: "collection", armed: false, parent });

// ---------- Actions ----------
const ACTIONS = {
  async "code-ok"() {
    const input = document.getElementById("code");
    const val = ((input && input.value) || "").trim();
    if (!val) return;
    S.code = val;
    try {
      await api("boards");
      ls.set("glane-code", val);
      start();
    } catch (e) {
      S.code = "";
      document.getElementById("codeerr").textContent = e.status === 401 ? T.codeBad : T.unreachable + e.message;
    }
  },
  home() {
    S.view = "home";
    S.q = "";
    const q = document.getElementById("q");
    if (q) q.value = "";
    renderMain();
    window.scrollTo(0, 0);
  },
  board(el) { S.view = el.dataset.id; renderMain(); window.scrollTo(0, 0); },
  add() { openSheet({ kind: "add" }); },
  photo() { pickFile("new"); },
  attach() { pickFile("attach"); },
  "add-next"() {
    const p = parseInput(document.getElementById("addtext").value);
    if (!p) return toast(T.typeSomething);
    openPick(p);
  },
  pick(el) {
    const id = el.dataset.id || null;
    choosePickBoard(id ? S.boards.find((b) => b.id === id) : null);
  },
  "save-date"() { save(S.sheet.boardId); },
  "skip-date"() { S.sheet.event_date = ""; save(S.sheet.boardId); },
  "back-boards"() { S.sheet.step = "boards"; S.sheet.event_date = ""; renderSheet(); },
  more() { S.sheet.more = !S.sheet.more; renderSheet(); },
  item(el) { openDetail(el.dataset.id); },
  "detail-board"(el) { S.sheet.board_id = el.dataset.id || null; renderSheet(); },
  async "detail-save"() {
    const s = S.sheet;
    const i = S.items.find((x) => x.id === s.id);
    const body = { title: s.title, note: s.note, board_id: s.board_id, event_date: s.event_date || null };
    if (i && i.type === "text") body.text = s.text;
    try {
      const { item } = await api("items?id=" + s.id, { method: "PATCH", body });
      replaceItem(item);
      S.sheet = null;
      renderSheet();
      renderMain();
      toast(T.saved);
    } catch (e) {
      handleErr(e);
    }
  },
  "replace-img"() { pickFile("replace"); },
  async refresh() {
    const s = S.sheet;
    const before = S.items.find((x) => x.id === s.id);
    s.busy = "refresh";
    renderSheet();
    try {
      const { item } = await api("items?id=" + s.id, { method: "PATCH", body: { refresh: true } });
      replaceItem(item);
      if (S.sheet === s) {
        s.busy = "";
        s.title = cleanTitle(item.title);
        renderSheet();
      }
      renderMain();
      const improved = (item.image_url && !before.image_url) || (cleanTitle(item.title) && !cleanTitle(before.title));
      toast(improved ? T.refreshed : T.refreshNone);
    } catch (e) {
      s.busy = "";
      if (S.sheet === s) renderSheet();
      handleErr(e);
    }
  },
  async "detail-delete"() {
    const s = S.sheet;
    if (!s.armed) { s.armed = true; return renderSheet(); }
    try {
      await api("items?id=" + s.id, { method: "DELETE" });
      S.items = S.items.filter((x) => x.id !== s.id);
      S.sheet = null;
      renderSheet();
      renderMain();
      toast(T.deleted);
    } catch (e) {
      handleErr(e);
    }
  },
  "new-board"() { openSheet(newBoardSheet(null)); },
  "new-board-pick"() { openSheet(newBoardSheet(S.sheet)); },
  "edit-board"(el) {
    const b = S.boards.find((x) => x.id === el.dataset.id);
    if (b) openSheet({ kind: "board", id: b.id, name: b.name, emoji: b.emoji, color: b.color, boardKind: b.kind || "collection", armed: false });
  },
  "board-kind"(el) { S.sheet.boardKind = el.dataset.v; renderSheet(); },
  emoji(el) { S.sheet.emoji = el.dataset.v; renderSheet(); },
  color(el) { S.sheet.color = el.dataset.v; renderSheet(); },
  async "board-save"() {
    const s = S.sheet;
    const name = s.name.trim();
    if (!name) return toast(T.nameIt);
    const body = { name, emoji: s.emoji, color: s.color, kind: s.boardKind };
    try {
      if (s.id) {
        const { board } = await api("boards?id=" + s.id, { method: "PATCH", body });
        S.boards = S.boards.map((b) => (b.id === board.id ? board : b));
        S.sheet = null;
        renderSheet();
        renderMain();
        return;
      }
      const { board } = await api("boards", { method: "POST", body });
      S.boards.push(board);
      renderMain();
      if (s.parent) {
        S.sheet = s.parent;
        renderSheet();
        choosePickBoard(board);
      } else {
        S.sheet = null;
        renderSheet();
        S.view = board.id;
        renderMain();
      }
    } catch (e) {
      handleErr(e);
    }
  },
  async "board-delete"() {
    const s = S.sheet;
    if (!s.armed) { s.armed = true; return renderSheet(); }
    try {
      await api("boards?id=" + s.id, { method: "DELETE" });
      S.boards = S.boards.filter((b) => b.id !== s.id);
      S.items = S.items.map((i) => (i.board_id === s.id ? { ...i, board_id: null } : i));
      S.sheet = null;
      S.view = "home";
      renderSheet();
      renderMain();
      toast(T.boardDeleted);
    } catch (e) {
      handleErr(e);
    }
  },
  close() { closeSheet(); },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;
  if (a === "backdrop") {
    if (e.target === el) closeSheet();
    return;
  }
  const fn = ACTIONS[a];
  if (fn) {
    e.preventDefault();
    fn(el);
  }
});

document.addEventListener("input", (e) => {
  const f = e.target.dataset && e.target.dataset.field;
  if (!f || !S.sheet) return;
  S.sheet[f] = e.target.value;
  if (f === "name") {
    const b = document.querySelector("#edprev b");
    if (b) b.textContent = e.target.value || T.boardDefault;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.sheet) return closeSheet();
  if (e.key === "Enter") {
    if (e.target.id === "code") return ACTIONS["code-ok"]();
    const item = e.target.closest && e.target.closest('[data-a="item"]');
    if (item && e.target === item) openDetail(item.dataset.id);
  }
});

$file.addEventListener("change", async () => {
  const f = $file.files[0];
  $file.value = "";
  if (!f) return;
  let dataUrl;
  try {
    dataUrl = await compress(f);
  } catch {
    return toast(T.imgFail);
  }
  const shot = { dataUrl, b64: dataUrl.split(",")[1] };
  const s = S.sheet;

  if (S.fileTarget === "attach" && s && s.kind === "pick") {
    s.attach = shot;
    const pv = document.getElementById("pv");
    if (pv) pv.innerHTML = pickPreview(s);
    return;
  }

  if (S.fileTarget === "replace" && s && s.kind === "detail") {
    s.busy = "image";
    renderSheet();
    try {
      const { item } = await api("items?id=" + s.id, { method: "PATCH", body: { image_base64: shot.b64 } });
      replaceItem(item);
      toast(T.imgUpdated);
    } catch (e) {
      handleErr(e);
    }
    s.busy = "";
    if (S.sheet === s) renderSheet();
    renderMain();
    return;
  }

  openPick({ kind: "image", ...shot });
});

// Sur ordinateur : coller ou glisser-déposer
async function intakeFile(file) {
  try {
    const dataUrl = await compress(file);
    openPick({ kind: "image", dataUrl, b64: dataUrl.split(",")[1] });
  } catch {
    toast(T.imgFail);
  }
}

window.addEventListener("paste", (e) => {
  if (!S.code || S.sheet) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  const cd = e.clipboardData;
  if (!cd) return;
  const file = [...(cd.files || [])].find((f) => f.type.startsWith("image/"));
  if (file) {
    e.preventDefault();
    return intakeFile(file);
  }
  const t = cd.getData("text/plain");
  if (t) {
    e.preventDefault();
    openPick(parseInput(t));
  }
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault();
  if (!S.code || S.sheet) return;
  const dt = e.dataTransfer;
  const file = [...(dt.files || [])].find((f) => f.type.startsWith("image/"));
  if (file) return intakeFile(file);
  const t = (dt.getData("text/uri-list") || "").split(/\r?\n/).find((l) => l && !l.startsWith("#")) || dt.getData("text/plain");
  if (t) openPick(parseInput(t));
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
start();
</script>
</body>
</html>
